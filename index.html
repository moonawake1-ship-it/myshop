<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>軍一補救教室 ｜ 軍醫補救教室主頁</title>
<style>
:root{
  --bg-main:#050505;--bg-gradient:linear-gradient(135deg,#020202 0%,#0d0d0d 100%);
  --nav-bg:rgba(15,15,15,.85);--card-bg:rgba(20,20,20,.85);--card-border:rgba(0,255,102,.15);
  --text-main:#f3f4f6;--text-muted:#9ca3af;--chat-bg:rgba(10,10,10,.95);--input-bg:#1a1a1a;
  --primary-light:#00ff66;--accent:#00f0ff;--shadow:0 10px 35px rgba(0,255,102,.05);--logo-color:#fff
}
[data-theme="light"]{
  --bg-main:#f8fafc;--bg-gradient:linear-gradient(135deg,#fff 0%,#f1f5f9 100%);
  --nav-bg:rgba(255,255,255,.85);--card-bg:rgba(255,255,255,.9);--card-border:rgba(15,23,42,.08);
  --text-main:#0f172a;--text-muted:#475569;--chat-bg:#fff;--input-bg:#f1f5f9;
  --primary-light:#2563eb;--accent:#d97706;--shadow:0 10px 30px rgba(0,0,0,.05);--logo-color:#000
}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:var(--bg-main);background-image:var(--bg-gradient);color:var(--text-main);min-height:100vh;padding-top:90px;overflow-x:hidden;position:relative;transition:background .6s ease,color .45s ease}
a,button,input{font:inherit}a,button{cursor:pointer!important}input{cursor:text!important}
button,input,nav,.chat-container,.music-player-container{transition:background .35s,color .35s,border-color .35s,box-shadow .35s,transform .2s}
.click-ripple{position:fixed;width:10px;height:10px;border:3px solid var(--primary-light);border-radius:50%;pointer-events:none;z-index:29999;transform:translate(-50%,-50%);animation:ripple-out .4s forwards;box-shadow:0 0 8px var(--primary-light)}
@keyframes ripple-out{to{width:55px;height:55px;opacity:0}}
#fx-canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9998}

/* NAV */
nav{position:fixed;top:0;left:0;width:100%;height:70px;background:var(--nav-bg);border-bottom:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;padding:0 40px;z-index:1000;backdrop-filter:blur(12px)}
.logo{font-size:1.3rem;font-weight:700;color:var(--logo-color);white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:26px;min-width:0}
nav ul{display:flex;list-style:none;gap:22px;align-items:center;min-width:0}
nav li{flex-shrink:0}
nav a{color:var(--text-main);text-decoration:none;font-size:.98rem;font-weight:500;white-space:nowrap}
nav a:hover{color:var(--primary-light)}
.party-link{color:#e7c45b!important}
.party-link:hover{color:#ffdf78!important;text-shadow:0 0 12px rgba(231,196,91,.35)}
.desktop-label{display:inline}.mobile-label{display:none}
.controls-group{display:flex;align-items:center;gap:12px;flex-shrink:0}
.music-player-container{display:flex;align-items:center;gap:10px;background:var(--card-bg);padding:6px 14px;border-radius:30px;border:1px solid var(--card-border)}
.disc-btn{width:36px;height:36px;background:#111;border:2px solid #333;border-radius:50%;position:relative}
.disc-btn:after{content:"";position:absolute;width:8px;height:8px;background:var(--primary-light);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.disc-btn.playing{animation:spin 4s linear infinite;box-shadow:0 0 10px var(--primary-light);border-color:var(--primary-light)}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-box{display:flex;flex-direction:column;width:110px;font-size:.75rem}
.time-info{display:flex;justify-content:space-between;margin-bottom:2px;font-family:monospace}
.slider-bar{width:100%;appearance:none;height:4px;background:rgba(255,255,255,.1);border-radius:2px;outline:none}
.icon-btn{background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-main);width:40px;height:40px;border-radius:50%;font-size:1.1rem}

/* MAIN */
.main-layout{display:flex;max-width:1200px;margin:40px auto;padding:0 20px;gap:40px;align-items:flex-start}
.hero-section{flex:1;padding:20px 0}
.hero-section h1{font-size:3rem;margin-bottom:20px;color:var(--primary-light)}
.hero-section p{color:var(--text-muted);font-size:1.2rem;line-height:1.8;margin-bottom:30px}
.media-box{width:100%;border-radius:15px;overflow:hidden;border:2px solid var(--card-border);margin:25px 0;box-shadow:var(--shadow)}
.media-box img{width:100%;display:block;object-fit:cover}
.cta-btn{background:var(--primary-light);color:#000;padding:14px 35px;border-radius:50px;font-size:1.1rem;text-decoration:none;display:inline-block;font-weight:700;box-shadow:var(--shadow)}
.chat-container{width:400px;background:var(--chat-bg);border:1px solid var(--card-border);border-radius:20px;display:flex;flex-direction:column;height:580px;box-shadow:var(--shadow);overflow:hidden}
.chat-header{background:rgba(59,130,246,.1);padding:15px;font-weight:700;border-bottom:1px solid var(--card-border)}
.chat-messages{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{background:rgba(255,255,255,.03);padding:8px 12px;border-radius:12px;max-width:85%;font-size:.95rem}
.msg .user{font-weight:700;color:var(--primary-light);font-size:.85rem}
.msg .time-stamp{font-size:.7rem;color:var(--text-muted);display:block;text-align:right;margin-top:4px}
.chat-input-area{padding:12px;border-top:1px solid var(--card-border)}
.input-row{display:flex;gap:8px;width:100%}
.name-input,.msg-input{padding:10px;background:var(--input-bg);border:1px solid var(--card-border);color:var(--text-main);border-radius:8px;outline:none}
.name-input{width:90px;text-align:center}.msg-input{flex:1}.chat-send-btn{background:var(--primary-light);color:#000;border:0;padding:0 16px;border-radius:8px;font-weight:700}

/* CALL */
.floating-call-btn{position:fixed;bottom:30px;right:30px;width:65px;height:65px;border-radius:50%;border:3px solid var(--primary-light);background:#000;z-index:10000;overflow:hidden;box-shadow:0 4px 20px rgba(0,255,102,.4)}
.floating-call-btn:hover{transform:scale(1.08)}.floating-call-btn img{width:100%;height:100%;object-fit:cover}
.sim-call-hidden{display:none!important}.sim-call-overlay{position:fixed;inset:0;z-index:20000;background:#000;overflow:hidden}
.sim-call-bg{position:absolute;inset:-30px;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.72)),url("xi.jpg") center/cover no-repeat;filter:blur(12px);transform:scale(1.06)}
.sim-call-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
.sim-call-ui{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 18px 52px;color:#fff;text-align:center}
.sim-call-avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.78);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.sim-call-name{margin-top:20px;font-size:34px;font-weight:800}.sim-call-status,.sim-call-timer{margin-top:8px;font-size:17px;color:rgba(255,255,255,.82)}
.sim-call-controls{margin-top:auto;width:100%;display:flex;justify-content:center;align-items:center;gap:48px;padding-bottom:16px}
.sim-call-control{display:flex;flex-direction:column;align-items:center;gap:10px}.sim-round-btn{width:76px;height:76px;border:0;border-radius:50%;color:#fff;font-size:29px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sim-round-btn:hover{transform:scale(1.06)}.sim-accept{background:#34c759}.sim-reject{background:#ff3b30}.sim-secondary{background:rgba(255,255,255,.2)}
.sim-call-ended{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.91);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.sim-call-ended h2{margin-bottom:12px;font-size:34px}.sim-call-ended p{color:rgba(255,255,255,.68)}.sim-return-btn{margin-top:20px;padding:12px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;font-weight:700}

/* PHONE: 整條導覽維持一行 */
@media(max-width:768px){
  body{padding-top:68px}
  nav{height:58px;padding:0 6px;gap:4px}
  .logo{font-size:.72rem!important;max-width:62px;overflow:hidden}
  .logo .long-logo{display:none}
  .nav-right{gap:4px;flex:1;min-width:0}
  nav ul{flex:1;gap:1px;justify-content:space-around;overflow:hidden}
  nav a{display:flex;align-items:center;justify-content:center;width:30px;height:32px;font-size:1rem}
  .desktop-label,.mobile-label{display:none!important}
  .controls-group{gap:3px}.music-player-container{padding:2px 3px;border-radius:18px}.progress-box{display:none}
  .disc-btn,.icon-btn{width:28px;height:28px}.icon-btn{font-size:.8rem}.disc-btn:after{width:6px;height:6px}
  .floating-call-btn{bottom:16px;right:16px;width:48px;height:48px;border-width:2px}
  .main-layout{flex-direction:column;width:100%;padding:0 12px;gap:25px;margin-top:10px}
  .hero-section{width:100%;text-align:center}.hero-section h1{font-size:2rem}.hero-section p{font-size:1rem}
  .media-box img{max-height:260px}.cta-btn{width:100%;text-align:center}.chat-container{width:100%;height:540px}
  .sim-call-controls{gap:25px}.sim-round-btn{width:66px;height:66px;font-size:25px}.sim-call-avatar{width:112px;height:112px}.sim-call-name{font-size:29px}
}
</style>
</head>
<body>
<canvas id="fx-canvas"></canvas>
<audio id="bg-music" loop src="music.mp3"></audio>
<audio id="click-sound" src="pop.mp3" preload="auto"></audio>

<button id="sim-call-open" class="floating-call-btn" title="模擬通話"><img src="xi.jpg" alt="通話圖標"></button>

<nav>
  <div class="logo">⚡<span class="long-logo"> 軍一補救教室</span></div>
  <div class="nav-right">
    <ul>
      <li><a href="index.html" title="主頁">🏠<span class="desktop-label"> 主頁</span></a></li>
      <li><a href="courses.html" title="購買課程">🛒<span class="desktop-label"> 購買課程</span></a></li>
      <li><a href="ai.html" title="AI題庫">🤖<span class="desktop-label"> AI題庫</span></a></li>
      <li><a href="contact.html" title="聯絡我們">✉️<span class="desktop-label"> 聯絡我們</span></a></li>
      <li><a href="revolution.html" class="party-link" title="新興革命黨">🏴<span class="desktop-label"> 新興革命黨</span></a></li>
    </ul>
    <div class="controls-group">

        <button class="disc-btn" id="music-toggle" title="播放/暫停音樂"></button>
        <div class="progress-box"><div class="time-info"><span id="current-time">00:00</span><span>04:00</span></div><input type="range" id="seek-bar" class="slider-bar" value="0" min="0" max="100"></div>
      </div>

<div class="main-layout">
  <div class="hero-section">
    <h1>軍一補救教室主頁</h1>
    <p>歡迎來到軍一補救教室！提供全台最精準的數位邏輯與微處理機複習，由淺入深帶您突破學習瓶頸。</p>

    <div class="sim-call-controls" id="sim-incoming-controls">
      <div class="sim-call-control"><button class="sim-round-btn sim-reject" id="sim-reject-btn">✕</button><div>拒接</div></div>
      <div class="sim-call-control"><button class="sim-round-btn sim-accept" id="sim-accept-btn">☎</button><div>接聽</div></div>

  <audio id="sim-ringtone" loop preload="auto"><source src="ringtone.mp3" type="audio/mpeg"></audio>
</div>

<script>
const $=id=>document.getElementById(id), clickSound=$("click-sound"),themeToggle=$("theme-toggle"),musicToggle=$("music-toggle"),bgMusic=$("bg-music"),seekBar=$("seek-bar"),currentTimeEl=$("current-time");
let isCanvasPaused=false;
window.addEventListener("click",e=>{clickSound.currentTime=0;clickSound.play().catch(()=>{});const r=document.createElement("div");r.className="click-ripple";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(()=>r.remove(),400)});
themeToggle.onclick=e=>{e.stopPropagation();const light=document.documentElement.getAttribute("data-theme")==="light";document.documentElement.setAttribute("data-theme",light?"dark":"light");themeToggle.textContent=light?"🌙":"☀️"};
musicToggle.onclick=e=>{e.stopPropagation();if(bgMusic.paused){bgMusic.play().catch(()=>{});musicToggle.classList.add("playing")}else{bgMusic.pause();musicToggle.classList.remove("playing")}};
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;
bgMusic.ontimeupdate=()=>{if(bgMusic.currentTime>=240){bgMusic.pause();bgMusic.currentTime=0;musicToggle.classList.remove("playing")}currentTimeEl.textContent=fmt(bgMusic.currentTime);seekBar.value=(bgMusic.currentTime/240)*100||0};
seekBar.oninput=()=>bgMusic.currentTime=(seekBar.value/100)*240;

/* 背景特效 */
const canvas=$("fx-canvas"),ctx=canvas.getContext("2d",{alpha:true});let traces=[],particles=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();
for(let i=0;i<15;i++)particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*3+2,dx:Math.random()*.4-.2,dy:Math.random()*.4+.2,o:Math.random()*.3+.1});
addEventListener("mousemove",e=>{if(isCanvasPaused)return;if(Math.random()<.15)traces.push({x:e.clientX,y:e.clientY,l:Math.random()*15+8,a:[0,Math.PI/4,Math.PI/2,Math.PI,-Math.PI/4][Math.floor(Math.random()*5)],o:1,w:Math.random()+.5})});
(function draw(){if(!isCanvasPaused){ctx.clearRect(0,0,canvas.width,canvas.height);const c=document.documentElement.getAttribute("data-theme")==="dark"?"#00ff66":"#2563eb";for(let i=traces.length-1;i>=0;i--){const t=traces[i],ex=t.x+Math.cos(t.a)*t.l,ey=t.y+Math.sin(t.a)*t.l;ctx.save();ctx.globalAlpha=t.o;ctx.strokeStyle=c;ctx.lineWidth=t.w;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore();t.o-=.04;if(t.o<=0)traces.splice(i,1)}particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.o;ctx.strokeStyle=c;ctx.strokeRect(p.x,p.y,p.s,p.s);ctx.restore();p.x+=p.dx;p.y+=p.dy;if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width}})}requestAnimationFrame(draw)})();

/* 模擬通話 */
const overlay=$("sim-call-overlay"),ui=$("sim-call-ui"),video=$("sim-call-video"),ring=$("sim-ringtone"),incoming=$("sim-incoming-controls"),active=$("sim-active-controls"),avatar=$("sim-call-avatar"),status=$("sim-call-status"),timer=$("sim-call-timer"),ended=$("sim-call-ended");
let sec=0,tick=null,muted=false,speaker=false;
function startCall(){isCanvasPaused=true;if(!bgMusic.paused){bgMusic.pause();musicToggle.classList.remove("playing")}overlay.classList.remove("sim-call-hidden");ui.classList.remove("sim-call-hidden");ended.classList.add("sim-call-hidden");video.classList.add("sim-call-hidden");avatar.classList.remove("sim-call-hidden");incoming.classList.remove("sim-call-hidden");active.classList.add("sim-call-hidden");timer.classList.add("sim-call-hidden");status.textContent="模擬來電中……";video.currentTime=0;ring.currentTime=0;ring.play().catch(()=>{})}
function endCall(){clearInterval(tick);ring.pause();video.pause();video.currentTime=0;ui.classList.add("sim-call-hidden");video.classList.add("sim-call-hidden");ended.classList.remove("sim-call-hidden")}
$("sim-call-open").onclick=e=>{e.stopPropagation();startCall()};
$("sim-accept-btn").onclick=async e=>{e.stopPropagation();ring.pause();incoming.classList.add("sim-call-hidden");active.classList.remove("sim-call-hidden");avatar.classList.add("sim-call-hidden");status.textContent="通話中";timer.classList.remove("sim-call-hidden");video.classList.remove("sim-call-hidden");sec=0;timer.textContent="00:00";clearInterval(tick);tick=setInterval(()=>timer.textContent=fmt(++sec),1000);try{video.currentTime=0;await video.play()}catch(err){console.log(err)}};
$("sim-reject-btn").onclick=endCall;$("sim-hangup-btn").onclick=endCall;video.onended=endCall;
$("sim-mute-btn").onclick=e=>{e.stopPropagation();muted=!muted;video.muted=muted;e.currentTarget.textContent=muted?"🔇":"🎙";$("sim-mute-text").textContent=muted?"取消靜音":"靜音"};
$("sim-speaker-btn").onclick=e=>{e.stopPropagation();speaker=!speaker;$("sim-speaker-text").textContent=speaker?"擴音開啟":"擴音";e.currentTarget.style.background=speaker?"rgba(255,255,255,.42)":"rgba(255,255,255,.2)"};
$("sim-return-btn").onclick=e=>{e.stopPropagation();overlay.classList.add("sim-call-hidden");ended.classList.add("sim-call-hidden");ui.classList.remove("sim-call-hidden");isCanvasPaused=false};
addEventListener("keydown",e=>{if(e.key==="Escape"&&!overlay.classList.contains("sim-call-hidden")){clearInterval(tick);ring.pause();video.pause();overlay.classList.add("sim-call-hidden");isCanvasPaused=false}});
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBNGJOpoMdyPLbM3R7-YrFcHlre9YMAaAw",authDomain:"junyi-chat.firebaseapp.com",projectId:"junyi-chat",storageBucket:"junyi-chat.firebasestorage.app",messagingSenderId:"395931311039",appId:"1:395931311039:web:f8532fea57a2f66c729f0a",measurementId:"G-DDB6M5V36C"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),name=document.getElementById("chat-name"),input=document.getElementById("chat-input"),box=document.getElementById("chat-box"),send=document.getElementById("chat-send");
const esc=t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const when=t=>{const d=new Date(t);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
onSnapshot(query(collection(db,"messages"),orderBy("time")),s=>{box.innerHTML="";s.forEach(x=>{const d=x.data(),m=document.createElement("div");m.className="msg";m.innerHTML=`<span class="user">${esc(d.user||"匿名同學")}</span>：${esc(d.text||"")}<span class="time-stamp">${when(d.time||Date.now())}</span>`;box.appendChild(m)});box.scrollTop=box.scrollHeight});
async function sendMsg(){const text=input.value.trim();if(!text)return;await addDoc(collection(db,"messages"),{user:name.value.trim()||"匿名同學",text,time:Date.now()});input.value=""}
send.onclick=e=>{e.stopPropagation();sendMsg()};input.onkeypress=e=>{if(e.key==="Enter")sendMsg()};
</script>
