<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>軍一補救教室 ｜ 軍醫補救教室主頁</title>

    <style>

        * {
            transition:
                background-color 0.45s ease,
                color 0.45s ease,
                border-color 0.45s ease,
                box-shadow 0.45s ease;
        }

        body {
            transition:
                background 0.6s ease,
                background-image 0.6s ease,
                color 0.45s ease;
        }

        nav,
        .course-card,
        .chat-container,
        .panel,
        .result-card,
        .card,
        .music-player-container,
        .icon-btn,
        input,
        textarea,
        select,
        button {
            transition:
                background 0.45s ease,
                background-color 0.45s ease,
                color 0.45s ease,
                border-color 0.45s ease,
                box-shadow 0.45s ease,
                transform 0.25s ease;
        }

        :root {
            --bg-main: #050505;
            --bg-gradient: linear-gradient(135deg, #020202 0%, #0d0d0d 100%);
            --nav-bg: rgba(15, 15, 15, 0.85);
            --card-bg: rgba(20, 20, 20, 0.85);
            --card-border: rgba(0, 255, 102, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --chat-bg: rgba(10, 10, 10, 0.95);
            --input-bg: #1a1a1a;
            --primary-light: #00ff66;
            --accent: #00f0ff;
            --shadow: 0 10px 35px rgba(0, 255, 102, 0.05);
            --logo-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --chat-bg: #ffffff;
            --input-bg: #f1f5f9;
            --primary-light: #2563eb;
            --accent: #d97706;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --logo-color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        html,
        body,
        button,
        a,
        input,
        textarea {
            cursor: none !important;
        }

        body {
            background: var(--bg-main);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 90px;
            overflow-x: hidden;
            position: relative;
        }

        #custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 30000;
            top: 0;
            left: 0;
            transform: translate(-10%, -10%);
        }

        #custom-cursor::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                #ffe600 0%,
                #ff6600 50%,
                #ff0000 100%
            );

            clip-path: polygon(
                55% 0%,
                10% 55%,
                50% 55%,
                40% 100%,
                90% 40%,
                50% 40%
            );

            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                filter: drop-shadow(0px 0px 4px #ff6600);
            }

            100% {
                filter: drop-shadow(0px 0px 10px #ff3300);
            }
        }

        .click-ripple {
            position: fixed;
            width: 10px;
            height: 10px;
            background: transparent;
            border: 3px solid var(--primary-light);
            border-radius: 50%;
            pointer-events: none;
            z-index: 29999;
            transform: translate(-50%, -50%);
            animation: ripple-out 0.4s forwards;
            box-shadow: 0 0 8px var(--primary-light);
        }

        @keyframes ripple-out {
            0% {
                width: 10px;
                height: 10px;
                opacity: 1;
            }

            100% {
                width: 55px;
                height: 55px;
                opacity: 0;
            }
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--card-border);

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 40px;

            z-index: 1000;

            backdrop-filter: blur(12px);
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--logo-color);
            white-space: nowrap;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 30px;
            min-width: 0;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
            min-width: 0;
        }

        nav ul li {
            flex-shrink: 0;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
        }

        nav ul li a:hover {
            color: var(--primary-light);
        }

        .desktop-label {
            display: inline;
        }

        .mobile-label {
            display: none;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .music-player-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .disc-btn {
            width: 36px;
            height: 36px;
            background: #111;
            border: 2px solid #333;
            border-radius: 50%;
            position: relative;
        }

        .disc-btn::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--primary-light);
            border-radius: 50%;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        .disc-btn.playing {
            animation: spin-disc 4s linear infinite;
            box-shadow: 0 0 10px var(--primary-light);
            border-color: var(--primary-light);
        }

        @keyframes spin-disc {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .progress-box {
            display: flex;
            flex-direction: column;
            width: 110px;
            font-size: 0.75rem;
            color: var(--text-main);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            font-family: monospace;
        }

        .slider-bar {
            width: 100%;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);

            width: 40px;
            height: 40px;

            border-radius: 50%;

            font-size: 1.1rem;
        }

        .main-layout {
            display: flex;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            gap: 40px;
            align-items: flex-start;
        }

        .hero-section {
            flex: 1;
            text-align: left;
            padding: 20px 0;
        }

        .hero-section h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--primary-light);
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .cta-btn {
            background: var(--primary-light);
            color: #000;

            padding: 14px 35px;

            border-radius: 50px;

            font-size: 1.1rem;
            text-decoration: none;

            display: inline-block;

            font-weight: bold;

            box-shadow: var(--shadow);
        }

        .media-box {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;

            border: 2px solid var(--card-border);

            margin: 25px 0;

            box-shadow: var(--shadow);
        }

        .media-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .chat-container {
            width: 400px;
            background: var(--chat-bg);

            border: 1px solid var(--card-border);

            border-radius: 20px;

            display: flex;
            flex-direction: column;

            height: 580px;

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .chat-header {
            background: rgba(59, 130, 246, 0.1);
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--card-border);
        }

        .chat-messages {
            flex: 1;
            padding: 15px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .msg {
            background: rgba(255, 255, 255, 0.03);

            padding: 8px 12px;

            border-radius: 12px;

            max-width: 85%;

            font-size: 0.95rem;
        }

        .msg .user {
            font-weight: bold;
            color: var(--primary-light);
            font-size: 0.85rem;
        }

        .msg .time-stamp {
            font-size: 0.7rem;
            color: var(--text-muted);

            display: block;

            text-align: right;

            margin-top: 4px;
        }

        .chat-input-area {
            padding: 12px;

            border-top: 1px solid var(--card-border);

            display: flex;
            flex-direction: column;

            gap: 8px;

            background: rgba(0, 0, 0, 0.02);
        }

        .input-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .name-input {
            width: 90px;

            padding: 10px;

            background: var(--input-bg);

            border: 1px solid var(--card-border);

            color: var(--text-main);

            border-radius: 8px;

            outline: none;

            text-align: center;
        }

        .msg-input {
            flex: 1;

            padding: 10px;

            background: var(--input-bg);

            border: 1px solid var(--card-border);

            color: var(--text-main);

            border-radius: 8px;

            outline: none;
        }

        .chat-send-btn {
            background: var(--primary-light);
            color: #000;

            border: none;

            padding: 0 16px;

            border-radius: 8px;

            font-weight: bold;
        }

        /* =========================
           浮動通話按鈕
        ========================== */

        .floating-call-btn {
            position: fixed;

            bottom: 30px;
            right: 30px;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            border: 3px solid var(--primary-light);

            background: #000;

            cursor: none;

            z-index: 10000;

            overflow: hidden;

            box-shadow:
                0 4px 20px rgba(0, 255, 102, 0.4);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .floating-call-btn:hover {
            transform: scale(1.1);

            box-shadow:
                0 6px 25px rgba(0, 255, 102, 0.6);
        }

        .floating-call-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* =========================
           通話畫面
        ========================== */

        .sim-call-hidden {
            display: none !important;
        }

        .sim-call-overlay {
            position: fixed;
            inset: 0;

            z-index: 20000;

            background: #000;

            overflow: hidden;
        }

        /*
            效能優化：
            不使用 blur、不使用 scale GPU layer。
        */

        .sim-call-bg {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.78)
                ),
                url("xi.jpg") center / cover no-repeat;

            filter: none;
            transform: none;
            will-change: auto;
        }

        /*
            影片優先。
            contain 可以降低瀏覽器裁切縮放負擔。
        */

        .sim-call-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;

            z-index: 1;

            transform: none;

            will-change: auto;
        }

        .sim-call-ui {
            position: relative;

            z-index: 3;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 60px 18px 52px;

            color: #fff;

            text-align: center;
        }

        .sim-call-avatar {
            width: 132px;
            height: 132px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid rgba(255, 255, 255, 0.78);

            box-shadow:
                0 14px 44px rgba(0, 0, 0, 0.50);
        }

        .sim-call-name {
            margin-top: 20px;

            font-size: 34px;

            font-weight: 800;
        }

        .sim-call-status,
        .sim-call-timer {
            margin-top: 8px;

            font-size: 17px;

            color: rgba(255, 255, 255, 0.82);
        }

        .sim-call-controls {
            margin-top: auto;

            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 48px;

            padding-bottom: 16px;
        }

        .sim-call-control {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;
        }

        .sim-round-btn {
            width: 76px;
            height: 76px;

            border: none;

            border-radius: 50%;

            color: #fff;

            font-size: 29px;

            display: flex;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .sim-round-btn:hover {
            transform: scale(1.06);
        }

        .sim-accept {
            background: #34c759;
        }

        .sim-reject {
            background: #ff3b30;
        }

        .sim-secondary {
            background: rgba(255, 255, 255, 0.20);
        }

        .sim-call-ended {
            position: absolute;

            inset: 0;

            z-index: 10;

            background:
                rgba(0, 0, 0, 0.91);

            color: #fff;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 28px;
        }

        .sim-call-ended h2 {
            margin: 0 0 12px;

            font-size: 34px;
        }

        .sim-call-ended p {
            max-width: 520px;

            line-height: 1.7;

            color:
                rgba(255, 255, 255, 0.68);
        }

        .sim-return-btn {
            margin-top: 20px;

            padding: 12px 22px;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, 0.20);

            background:
                rgba(255, 255, 255, 0.12);

            color: #fff;

            font-weight: 700;
        }

        /* =========================
           手機版
        ========================== */

        @media (max-width: 768px) {

            body {
                padding-top: 106px;
            }

            nav {
                height: 96px;

                padding: 6px 8px;

                display: grid;

                grid-template-columns:
                    auto 1fr auto;

                grid-template-rows:
                    34px 48px;

                column-gap: 8px;

                row-gap: 2px;

                align-items: center;
            }

            nav .logo {
                grid-column: 1 / 4;
                grid-row: 1;

                text-align: center;

                font-size:
                    0.95rem !important;

                line-height: 1;
            }

            .nav-right {
                grid-column: 1 / 4;
                grid-row: 2;

                width: 100%;

                display: flex;

                flex-direction: row;

                align-items: center;

                gap: 6px;

                min-width: 0;
            }

            nav ul {
                flex: 1;

                min-width: 0;

                display: flex;

                flex-wrap: nowrap;

                justify-content: flex-start;

                gap: 4px;

                overflow-x: auto;

                overflow-y: hidden;

                scrollbar-width: none;

                -ms-overflow-style: none;

                padding: 2px 0;
            }

            nav ul::-webkit-scrollbar {
                display: none;
            }

            nav ul li {
                flex: 0 0 auto;
            }

            nav ul li a {
                display: inline-flex;

                align-items: center;

                height: 30px;

                padding: 0 5px;

                font-size: 0.68rem;

                line-height: 1;

                white-space: nowrap;

                writing-mode:
                    horizontal-tb !important;
            }

            .desktop-label {
                display: none;
            }

            .mobile-label {
                display: inline;
            }

            .controls-group {
                width: auto;

                display: flex;

                flex-direction: row;

                align-items: center;

                justify-content: center;

                gap: 4px;

                flex-shrink: 0;
            }

            .music-player-container {
                width: auto;

                padding: 2px 4px;

                gap: 3px;

                border-radius: 20px;
            }

            .disc-btn {
                width: 28px;
                height: 28px;
            }

            .disc-btn::after {
                width: 6px;
                height: 6px;
            }

            .progress-box {
                display: none;
            }

            .icon-btn {
                width: 28px;
                height: 28px;

                font-size: 0.8rem;
            }

            .floating-call-btn {
                top: auto;
                left: auto;

                bottom: 16px;
                right: 16px;

                width: 48px;
                height: 48px;

                border-width: 2px;
            }

            .main-layout {
                flex-direction: column;

                width: 100%;

                padding: 0 12px;

                gap: 25px;

                margin-top: 10px;
            }

            .hero-section {
                width: 100%;
                text-align: center;
            }

            .hero-section h1 {
                font-size: 2rem;
                line-height: 1.3;
            }

            .hero-section p {
                font-size: 1rem;
            }

            .media-box img {
                max-height: 260px;
                object-fit: cover;
            }

            .cta-btn {
                width: 100%;
                text-align: center;
            }

            .chat-container {
                width: 100%;
                height: 540px;
            }

            .sim-call-controls {
                gap: 25px;
            }

            .sim-round-btn {
                width: 66px;
                height: 66px;

                font-size: 25px;
            }

            .sim-call-avatar {
                width: 112px;
                height: 112px;
            }

            .sim-call-name {
                font-size: 29px;
            }

        }

    </style>

</head>

<body>

    <div id="custom-cursor"></div>

    <canvas id="fx-canvas"></canvas>

    <audio
        id="bg-music"
        loop
        src="music.mp3">
    </audio>

    <audio
        id="click-sound"
        src="pop.mp3"
        preload="auto">
    </audio>


    <!-- =========================
         浮動通話按鈕
    ========================== -->

    <button
        id="sim-call-open"
        class="floating-call-btn"
        title="模擬通話">

        <img
            src="xi.jpg"
            alt="通話圖標">

    </button>


    <!-- =========================
         NAV
    ========================== -->

    <nav>

        <div class="logo">
            ⚡ 軍一補救教室
        </div>

        <div class="nav-right">

            <ul>

                <li>

                    <a href="index.html">

                        🏠

                        <span class="desktop-label">
                            主頁
                        </span>

                        <span class="mobile-label">
                            首頁
                        </span>

                    </a>

                </li>

                <li>

                    <a href="courses.html">

                        🛒

                        <span class="desktop-label">
                            購買課程
                        </span>

                        <span class="mobile-label">
                            課程
                        </span>

                    </a>

                </li>

                <li>

                    <a href="ai.html">

                        🤖

                        <span class="desktop-label">
                            AI題庫
                        </span>

                        <span class="mobile-label">
                            AI
                        </span>

                    </a>

                </li>

                <li>

                    <a href="contact.html">

                        ✉️

                        <span class="desktop-label">
                            聯絡我們
                        </span>

                        <span class="mobile-label">
                            聯絡
                        </span>

                    </a>

                </li>

                <li>

                    <a href="revolution.html">

                        🏴

                        <span class="desktop-label">
                            新興革命黨
                        </span>

                        <span class="mobile-label">
                            革命黨
                        </span>

                    </a>

                </li>

            </ul>


            <div class="controls-group">

                <div class="music-player-container">

                    <button
                        class="disc-btn"
                        id="music-toggle"
                        title="播放/暫停唱片">
                    </button>


                    <div class="progress-box">

                        <div class="time-info">

                            <span id="current-time">
                                00:00
                            </span>

                            <span id="total-time">
                                04:00
                            </span>

                        </div>

                        <input
                            type="range"
                            id="seek-bar"
                            class="slider-bar"
                            value="0"
                            min="0"
                            max="100">

                    </div>

                </div>


                <button
                    class="icon-btn"
                    id="theme-toggle">
                    🌙
                </button>

            </div>

        </div>

    </nav>


    <!-- =========================
         MAIN
    ========================== -->

    <div class="main-layout">

        <div class="hero-section">

            <h1>
                軍一補救教室主頁
            </h1>

            <p>
                歡迎來到軍一補救教室！
                提供全台最精準的數位邏輯與微處理機複習，
                由淺入深帶您突破學習瓶頸。
            </p>


            <div class="media-box">

                <img
                    src="hero.jpg"
                    alt="主頁大圖">

            </div>


            <a
                href="courses.html"
                class="cta-btn">

                立即前往選購課程

            </a>

        </div>


        <!-- =========================
             PUBLIC CHAT
        ========================== -->

        <div class="chat-container">

            <div class="chat-header">
                💬 線上公共聊天室
            </div>


            <div
                class="chat-messages"
                id="chat-box">

                <div class="msg">

                    <span class="user">
                        系統管理員
                    </span>

                    ：歡迎！
                    聊天室已改為 Firebase 即時同步。

                    <span class="time-stamp">
                        Online
                    </span>

    <script>

        /* =========================
           AUDIO / EFFECT STATE
        ========================== */

        const clickSound =
            document.getElementById(
                'click-sound'
            );

        let disableClickSound =
            false;


        /* =========================
           點擊特效
        ========================== */

        window.addEventListener(
            'click',
            (e) => {

                if (
                    !disableClickSound
                ) {

                    clickSound.currentTime =
                        0;

                    clickSound
                        .play()
                        .catch(
                            () => {}
                        );

                }


                if (
                    isCanvasPaused
                ) {
                    return;
                }


                const ripple =
                    document.createElement(
                        'div'
                    );

                ripple.className =
                    'click-ripple';

                ripple.style.left =
                    e.clientX + 'px';

                ripple.style.top =
                    e.clientY + 'px';

                document.body.appendChild(
                    ripple
                );

                setTimeout(
                    () => ripple.remove(),
                    400
                );

            }
        );


        /* =========================
           THEME
        ========================== */

        const themeToggle =
            document.getElementById(
                'theme-toggle'
            );


        themeToggle.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                if (
                    document.documentElement
                        .getAttribute(
                            'data-theme'
                        )
                    === 'light'
                ) {

                    document.documentElement
                        .setAttribute(
                            'data-theme',
                            'dark'
                        );

                    themeToggle.innerText =
                        '🌙';

                }

                else {

                    document.documentElement
                        .setAttribute(
                            'data-theme',
                            'light'
                        );

                    themeToggle.innerText =
                        '☀️';

                }

            }
        );


        /* =========================
           MUSIC
        ========================== */

        const musicToggle =
            document.getElementById(
                'music-toggle'
            );


        const bgMusic =
            document.getElementById(
                'bg-music'
            );


        const seekBar =
            document.getElementById(
                'seek-bar'
            );


        const currentTimeEl =
            document.getElementById(
                'current-time'
            );


        const maxDuration =
            240;


        musicToggle.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                if (
                    bgMusic.paused
                ) {

                    bgMusic
                        .play()
                        .catch(
                            () => {}
                        );

                    musicToggle
                        .classList
                        .add(
                            'playing'
                        );

                }

                else {

                    bgMusic.pause();

                    musicToggle
                        .classList
                        .remove(
                            'playing'
                        );

                }

            }
        );


        function formatTime(
            seconds
        ) {

            const min =
                Math.floor(
                    seconds / 60
                );

            const sec =
                Math.floor(
                    seconds % 60
                );

            return `${min < 10 ? "0" + min : min}:${sec < 10 ? "0" + sec : sec}`;

        }


        bgMusic.addEventListener(
            'timeupdate',
            () => {

                if (
                    bgMusic.currentTime
                    >= maxDuration
                ) {

                    bgMusic.pause();

                    bgMusic.currentTime =
                        0;

                    musicToggle
                        .classList
                        .remove(
                            'playing'
                        );

                    seekBar.value =
                        0;

                    currentTimeEl.innerText =
                        "00:00";

                    return;

                }


                currentTimeEl.innerText =
                    formatTime(
                        bgMusic.currentTime
                    );


                seekBar.value =
                    (
                        bgMusic.currentTime
                        / maxDuration
                    )
                    * 100
                    || 0;

            }
        );


        seekBar.addEventListener(
            'input',
            () => {

                bgMusic.currentTime =
                    (
                        seekBar.value
                        / 100
                    )
                    * maxDuration;

            }
        );


        /* =========================
           CANVAS
        ========================== */

        const cursorEl =
            document.getElementById(
                'custom-cursor'
            );


        const canvas =
            document.getElementById(
                'fx-canvas'
            );


        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha: true
                }
            );


        let pcbTraces =
            [];


        let neonMatrixParticles =
            [];


        let lastMouseMoveTime =
            0;


        let isCanvasPaused =
            false;


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        window.addEventListener(
            'resize',
            resizeCanvas
        );


        resizeCanvas();


        for (
            let i = 0;
            i < 15;
            i++
        ) {

            neonMatrixParticles.push({

                x:
                    Math.random()
                    * window.innerWidth,

                y:
                    Math.random()
                    * window.innerHeight,

                size:
                    Math.random()
                    * 3 + 2,

                speedX:
                    Math.random()
                    * 0.4 - 0.2,

                speedY:
                    Math.random()
                    * 0.4 + 0.2,

                opacity:
                    Math.random()
                    * 0.3 + 0.1

            });

        }


        window.addEventListener(
            'mousemove',
            (e) => {

                if (
                    !isCanvasPaused
                ) {

                    cursorEl.style.left =
                        e.clientX + 'px';

                    cursorEl.style.top =
                        e.clientY + 'px';

                }


                if (
                    isCanvasPaused
                ) {
                    return;
                }


                const now =
                    Date.now();


                if (
                    now
                    - lastMouseMoveTime
                    > 50
                    &&
                    Math.random()
                    < 0.2
                ) {

                    lastMouseMoveTime =
                        now;


                    const directions =
                        [
                            0,
                            Math.PI / 4,
                            Math.PI / 2,
                            Math.PI,
                            -Math.PI / 4
                        ];


                    pcbTraces.push({

                        startX:
                            e.clientX,

                        startY:
                            e.clientY,

                        length:
                            Math.random()
                            * 15 + 8,

                        angle:
                            directions[
                                Math.floor(
                                    Math.random()
                                    * directions.length
                                )
                            ],

                        opacity:
                            1,

                        width:
                            Math.random()
                            * 1.0 + 0.5

                    });

                }

            }
        );


        function animate() {

            if (
                !isCanvasPaused
            ) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const isDark =
                    document.documentElement
                        .getAttribute(
                            'data-theme'
                        )
                    === 'dark';


                const electroColor =
                    isDark
                        ? '#00ff66'
                        : '#2563eb';


                for (
                    let i =
                        pcbTraces.length - 1;

                    i >= 0;

                    i--
                ) {

                    const t =
                        pcbTraces[i];


                    ctx.save();


                    ctx.globalAlpha =
                        t.opacity;


                    ctx.strokeStyle =
                        electroColor;


                    ctx.lineWidth =
                        t.width;


                    ctx.beginPath();


                    ctx.moveTo(
                        t.startX,
                        t.startY
                    );


                    const endX =
                        t.startX
                        +
                        Math.cos(
                            t.angle
                        )
                        *
                        t.length;


                    const endY =
                        t.startY
                        +
                        Math.sin(
                            t.angle
                        )
                        *
                        t.length;


                    ctx.lineTo(
                        endX,
                        endY
                    );


                    ctx.stroke();


                    ctx.fillStyle =
                        electroColor;


                    ctx.beginPath();


                    ctx.arc(
                        endX,
                        endY,
                        t.width * 1.2,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();


                    ctx.restore();


                    t.opacity -=
                        0.04;


                    if (
                        t.opacity
                        <= 0
                    ) {

                        pcbTraces.splice(
                            i,
                            1
                        );

                    }

                }


                for (
                    let i = 0;

                    i <
                    neonMatrixParticles.length;

                    i++
                ) {

                    const s =
                        neonMatrixParticles[i];


                    ctx.save();


                    ctx.globalAlpha =
                        s.opacity;


                    ctx.strokeStyle =
                        electroColor;


                    ctx.lineWidth =
                        1;


                    ctx.strokeRect(
                        s.x,
                        s.y,
                        s.size,
                        s.size
                    );


                    ctx.restore();


                    s.x +=
                        s.speedX;


                    s.y +=
                        s.speedY;


                    if (
                        s.y
                        >
                        canvas.height
                    ) {

                        s.y =
                            0;


                        s.x =
                            Math.random()
                            *
                            canvas.width;

                    }

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();


        /* =========================
           SIM CALL
        ========================== */

        const simCallOpen =
            document.getElementById(
                'sim-call-open'
            );


        const simCallOverlay =
            document.getElementById(
                'sim-call-overlay'
            );


        const simCallUI =
            document.getElementById(
                'sim-call-ui'
            );


        const simCallVideo =
            document.getElementById(
                'sim-call-video'
            );


        const simRingtone =
            document.getElementById(
                'sim-ringtone'
            );


        const simIncomingControls =
            document.getElementById(
                'sim-incoming-controls'
            );


        const simActiveControls =
            document.getElementById(
                'sim-active-controls'
            );


        const simAcceptBtn =
            document.getElementById(
                'sim-accept-btn'
            );


        const simRejectBtn =
            document.getElementById(
                'sim-reject-btn'
            );


        const simHangupBtn =
            document.getElementById(
                'sim-hangup-btn'
            );


        const simMuteBtn =
            document.getElementById(
                'sim-mute-btn'
            );


        const simMuteText =
            document.getElementById(
                'sim-mute-text'
            );


        const simSpeakerBtn =
            document.getElementById(
                'sim-speaker-btn'
            );


        const simSpeakerText =
            document.getElementById(
                'sim-speaker-text'
            );


        const simCallStatus =
            document.getElementById(
                'sim-call-status'
            );


        const simCallTimer =
            document.getElementById(
                'sim-call-timer'
            );


        const simCallAvatar =
            document.getElementById(
                'sim-call-avatar'
            );


        const simCallEnded =
            document.getElementById(
                'sim-call-ended'
            );


        const simReturnBtn =
            document.getElementById(
                'sim-return-btn'
            );


        const simCallBg =
            document.getElementById(
                'sim-call-bg'
            );


        let simTimerInterval =
            null;


        let simSeconds =
            0;


        let simMuted =
            false;


        let simSpeakerOn =
            false;


        /*
            關閉不必要特效。
        */

        function enableVideoPerformanceMode() {

            isCanvasPaused =
                true;


            disableClickSound =
                true;


            canvas.style.display =
                'none';


            cursorEl.style.display =
                'none';


            /*
                接聽後連來電背景也拿掉，
                只留下影片本身。
            */

            simCallBg.style.display =
                'none';


            if (
                !bgMusic.paused
            ) {

                bgMusic.pause();

                musicToggle
                    .classList
                    .remove(
                        'playing'
                    );

            }


            clickSound.pause();

            clickSound.currentTime =
                0;

        }


        function disableVideoPerformanceMode() {

            isCanvasPaused =
                false;


            disableClickSound =
                false;


            canvas.style.display =
                'block';


            cursorEl.style.display =
                'block';


            simCallBg.style.display =
                'block';

        }


        function simStartCall() {

            /*
                來電階段仍然可以保留背景，
                但 Canvas 先暫停。
            */

            isCanvasPaused =
                true;


            canvas.style.display =
                'none';


            cursorEl.style.display =
                'none';


            disableClickSound =
                true;


            if (
                !bgMusic.paused
            ) {

                bgMusic.pause();

                musicToggle
                    .classList
                    .remove(
                        'playing'
                    );

            }


            simCallBg.style.display =
                'block';


            simCallOverlay
                .classList
                .remove(
                    'sim-call-hidden'
                );


            simCallUI
                .classList
                .remove(
                    'sim-call-hidden'
                );


            simCallEnded
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallVideo
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallAvatar
                .classList
                .remove(
                    'sim-call-hidden'
                );


            simIncomingControls
                .classList
                .remove(
                    'sim-call-hidden'
                );


            simActiveControls
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallTimer
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallStatus.textContent =
                '正在來電……';


            simSeconds =
                0;


            simMuted =
                false;


            simSpeakerOn =
                false;


            simCallVideo.muted =
                false;


            simCallVideo.currentTime =
                0;


            simMuteBtn.textContent =
                '🎙';


            simMuteText.textContent =
                '靜音';


            simSpeakerText.textContent =
                '擴音';


            simSpeakerBtn.style.background =
                'rgba(255,255,255,.20)';


            simRingtone.currentTime =
                0;


            simRingtone
                .play()
                .catch(
                    () => {}
                );

        }


        function simUpdateTimer() {

            const m =
                String(
                    Math.floor(
                        simSeconds / 60
                    )
                )
                .padStart(
                    2,
                    '0'
                );


            const s =
                String(
                    simSeconds % 60
                )
                .padStart(
                    2,
                    '0'
                );


            simCallTimer.textContent =
                `${m}:${s}`;

        }


        function simEndCall() {

            clearInterval(
                simTimerInterval
            );


            simRingtone.pause();


            simRingtone.currentTime =
                0;


            simCallVideo.pause();


            simCallVideo.currentTime =
                0;


            simCallUI
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallVideo
                .classList
                .add(
                    'sim-call-hidden'
                );


            simCallEnded
                .classList
                .remove(
                    'sim-call-hidden'
                );

        }


        simCallOpen.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                simStartCall();

            }
        );


        simAcceptBtn.addEventListener(
            'click',
            async (e) => {

                e.stopPropagation();


                simRingtone.pause();


                simRingtone.currentTime =
                    0;


                /*
                    啟動影片效能模式。
                */

                enableVideoPerformanceMode();


                simIncomingControls
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simActiveControls
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simCallAvatar
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simCallStatus.textContent =
                    '通話中';


                simCallTimer
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simCallVideo
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simSeconds =
                    0;


                simUpdateTimer();


                clearInterval(
                    simTimerInterval
                );


                simTimerInterval =
                    setInterval(
                        () => {

                            simSeconds++;

                            simUpdateTimer();

                        },
                        1000
                    );


                try {

                    /*
                        load 有時可以避免瀏覽器
                        尚未準備好影片。
                    */

                    if (
                        simCallVideo.readyState
                        < 2
                    ) {

                        simCallVideo.load();

                    }


                    simCallVideo.currentTime =
                        0;


                    simCallVideo.muted =
                        false;


                    await simCallVideo.play();

                }

                catch (err) {

                    console.log(
                        '影片播放失敗：',
                        err
                    );

                }

            }
        );


        simRejectBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                simEndCall();

            }
        );


        simHangupBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                simEndCall();

            }
        );


        simCallVideo.addEventListener(
            'ended',
            simEndCall
        );


        simMuteBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();


                simMuted =
                    !simMuted;


                simCallVideo.muted =
                    simMuted;


                simMuteBtn.textContent =
                    simMuted
                        ? '🔇'
                        : '🎙';


                simMuteText.textContent =
                    simMuted
                        ? '取消靜音'
                        : '靜音';

            }
        );


        simSpeakerBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();


                simSpeakerOn =
                    !simSpeakerOn;


                simSpeakerText.textContent =
                    simSpeakerOn
                        ? '擴音開啟'
                        : '擴音';


                simSpeakerBtn.style.background =
                    simSpeakerOn
                        ? 'rgba(255,255,255,.42)'
                        : 'rgba(255,255,255,.20)';

            }
        );


        simReturnBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();


                simCallOverlay
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simCallEnded
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simCallUI
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simIncomingControls
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simActiveControls
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simCallAvatar
                    .classList
                    .remove(
                        'sim-call-hidden'
                    );


                simCallTimer
                    .classList
                    .add(
                        'sim-call-hidden'
                    );


                simCallStatus.textContent =
                    '正在來電……';


                disableVideoPerformanceMode();

            }
        );


        document.addEventListener(
            'keydown',
            (e) => {

                if (
                    e.key === 'Escape'
                    &&
                    !simCallOverlay
                        .classList
                        .contains(
                            'sim-call-hidden'
                        )
                ) {

                    clearInterval(
                        simTimerInterval
                    );


                    simRingtone.pause();


                    simCallVideo.pause();


                    simCallOverlay
                        .classList
                        .add(
                            'sim-call-hidden'
                        );


                    disableVideoPerformanceMode();

                }

            }
        );

    </script>

                (char) => ({

                    '&':
                        '&amp;',

                    '<':
                        '&lt;',

                    '>':
                        '&gt;',

                    '"':
                        '&quot;',

                    "'":
                        '&#039;'

                }[char])
            );

        }


        function formatMessageTime(
            timestamp
        ) {

            const date =
                new Date(
                    timestamp
                );


            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

        }


        const q =
            query(
                collection(
                    db,
                    "messages"
                ),
                orderBy(
                    "time"
                )
            );


        onSnapshot(
            q,
            (snapshot) => {

                chatBox.innerHTML =
                    "";


                snapshot.forEach(
                    (doc) => {

                        const data =
                            doc.data();


                        const msg =
                            document.createElement(
                                'div'
                            );


                        msg.className =
                            'msg';


                        msg.innerHTML =
                            `
                            <span class="user">
                                ${escapeHTML(data.user || "匿名同學")}
                            </span>
                            ：
                            ${escapeHTML(data.text || "")}

                            <span class="time-stamp">
                                ${formatMessageTime(data.time || Date.now())}
                            </span>
                            `;


                        chatBox.appendChild(
                            msg
                        );

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }
        );


        async function sendFirebaseMessage() {

            const text =
                chatInput.value.trim();


            const userNickname =
                chatName.value.trim()
                ||
                "匿名同學";


            if (
                !text
            ) {
                return;
            }


            await addDoc(
                collection(
                    db,
                    "messages"
                ),
                {

                    user:
                        userNickname,

                    text:
                        text,

                    time:
                        Date.now()

                }
            );


            chatInput.value =
                "";

        }


        chatSend.addEventListener(
            'click',
            async (e) => {

                e.stopPropagation();

                await sendFirebaseMessage();

            }
        );


        chatInput.addEventListener(
            'keypress',
            async (e) => {

                if (
                    e.key === 'Enter'
                ) {

                    await sendFirebaseMessage();

                }

            }
        );

    </script>

</body>

</html>
