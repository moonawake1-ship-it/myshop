<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軍一 AI 題庫</title>

    <style>
        :root {
            --bg-main: #050505;
            --bg-gradient: linear-gradient(135deg, #020202 0%, #0d0d0d 100%);
            --nav-bg: rgba(15, 15, 15, 0.88);
            --card-bg: rgba(20, 20, 20, 0.88);
            --card-border: rgba(0, 255, 102, 0.16);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #171717;
            --primary-light: #00ff66;
            --accent: #00f0ff;
            --shadow: 0 10px 35px rgba(0, 255, 102, 0.06);
            --logo-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --nav-bg: rgba(255,255,255,0.9);
            --card-bg: rgba(255,255,255,0.94);
            --card-border: rgba(15,23,42,0.09);
            --text-main: #0f172a;
            --text-muted: #475569;
            --input-bg: #f1f5f9;
            --primary-light: #2563eb;
            --accent: #d97706;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --logo-color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            padding-top: 100px;
            color: var(--text-main);
            background: var(--bg-main);
            background-image: var(--bg-gradient);
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--logo-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav ul {
            display: flex;
            gap: 22px;
            list-style: none;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--primary-light);
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 20px 0 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            color: var(--primary-light);
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .page-title p {
            color: var(--text-muted);
        }

        .ai-layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 28px;
            align-items: start;
        }

        .panel,
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .panel h2,
        .result-card h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        select,
        input {
            width: 100%;
            padding: 12px 13px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--primary-light);
        }

        .generate-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-light);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
        }

        .generate-btn:disabled {
            opacity: 0.65;
        }

        .hint {
            margin-top: 14px;
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .badge {
            border: 1px solid var(--card-border);
            border-radius: 999px;
            padding: 6px 10px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .empty-state {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        .choice {
            display: block;
            padding: 12px 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            line-height: 1.6;
            cursor: pointer;
        }

        .choice:hover {
            border-color: var(--primary-light);
        }

        .choice input[type="radio"] {
            width: auto;
            margin-right: 10px;
            accent-color: var(--primary-light);
        }

        .submit-answer-btn {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .submit-answer-btn:hover {
            filter: brightness(1.08);
        }

        .result-feedback {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            line-height: 1.6;
        }

        .answer,
        .explanation {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.7;
        }

        .answer {
            border: 1px solid rgba(0,255,102,0.25);
        }

        .explanation {
            border: 1px solid rgba(0,240,255,0.22);
        }

        .loading {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-light);
            text-align: center;
            line-height: 1.7;
        }

        @media (max-width: 800px) {
            body {
                padding-top: 165px;
            }

            nav {
                height: auto;
                padding: 12px;
                flex-direction: column;
                gap: 12px;
            }

            .nav-right {
                flex-direction: column;
                gap: 12px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }

            .ai-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">⚡ 軍一補救教室</div>

        <div class="nav-right">
            <ul>
                <li><a href="index.html">🏠 主頁</a></li>
                <li><a href="courses.html">🛒 購買課程</a></li>
                <li><a href="ai.html" style="color: var(--primary-light);">🤖 AI題庫</a></li>
                <li><a href="contact.html">✉️ 聯絡我們</a></li>
            </ul>

            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <h1>🤖 軍一 AI 智慧題庫</h1>
            <p>選擇科目、章節與難度，讓 AI 即時生成四選一練習題。</p>
        </div>

        <div class="ai-layout">
            <div class="panel">
                <h2>⚙️ 命題條件設定</h2>

                <label for="subject-select">選擇科目</label>

                <select id="subject-select">
                    <option value="電子學">基本電子學</option>
                    <option value="數位邏輯">數位邏輯設計</option>
                    <option value="微處理機">微處理機實務</option>
                    <option value="基本電學">基本電學</option>
                    <option value="統測數學">統測數學(C)</option>
                    <option value="國文">國文</option>
                    <option value="英文">英文</option>

                    <!-- 新增：計算機概論 -->
                    <option value="計算機概論">計算機概論</option>
                </select>

                <label for="topic-input">章節或核心主題</label>

                <input
                    type="text"
                    id="topic-input"
                    placeholder="例如：作業系統、網路架構、二進位"
                    value="基礎概念"
                >

                <label for="difficulty-select">題目難易度</label>

                <select id="difficulty-select">
                    <option value="簡單">簡單（基本觀念題）</option>
                    <option value="普通" selected>普通（統測程度）</option>
                    <option value="困難">困難（進階應用題）</option>
                </select>

                <button
                    class="generate-btn"
                    id="generate-btn"
                    onclick="generateQuestion()">
                    🔮 立即生成單選題
                </button>

                <p class="hint">
                    💡 計算機概論可以輸入：資料表示法、作業系統、電腦硬體、網路、資訊安全等主題。
                </p>
            </div>

            <div class="result-card">
                <div class="result-header">
                    <h2>📝 智慧生成試題</h2>
                    <span class="badge" id="status-badge">等待命題</span>
                </div>

                <div id="question-box">
                    <div class="empty-state">
                        <div class="empty-icon">🤖</div>
                        <p>請於左側選取科目並點擊生成按鈕</p>
                        <p style="font-size: 0.85rem; margin-top: 5px;">
                            系統將即時產生一題四選一練習題
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://junyi-myshop.onrender.com';

        let currentQuestion = null;

        function toggleTheme() {
            const currentTheme =
                document.documentElement.getAttribute('data-theme');

            document.documentElement.setAttribute(
                'data-theme',
                currentTheme === 'light' ? 'dark' : 'light'
            );
        }

        async function generateQuestion() {
            const subject =
                document.getElementById('subject-select').value;

            const topic =
                document.getElementById('topic-input').value.trim();

            const difficulty =
                document.getElementById('difficulty-select').value;

            const qBox =
                document.getElementById('question-box');

            const badge =
                document.getElementById('status-badge');

            const generateBtn =
                document.getElementById('generate-btn');

            if (!topic) {
                alert('請先輸入章節或核心主題。');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = '⏳ AI 出題中...';
            badge.innerText = '生成中';

            qBox.innerHTML = `
                <div class="loading">
                    <span>⚡ 正在呼叫軍一後台 AI，請稍候...</span>
                </div>
            `;

            try {
                const res =
                    await fetch(
                        `${API_BASE_URL}/api/generate-question`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type':
                                    'application/json'
                            },
                            body: JSON.stringify({
                                subject,
                                topic,
                                difficulty
                            })
                        }
                    );

                const data =
                    await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.message ||
                        data.error ||
                        '後端回應異常'
                    );
                }

                if (
                    data.success &&
                    data.question
                ) {
                    const q =
                        data.question;

                    currentQuestion =
                        q;

                    qBox.innerHTML = `
                        <div class="question-title">
                            ❓ 題目：${escapeHTML(q.question)}
                        </div>

                        <label class="choice">
                            <input type="radio" name="answer" value="A">
                            A. ${escapeHTML(q.choices[0])}
                        </label>

                        <label class="choice">
                            <input type="radio" name="answer" value="B">
                            B. ${escapeHTML(q.choices[1])}
                        </label>

                        <label class="choice">
                            <input type="radio" name="answer" value="C">
                            C. ${escapeHTML(q.choices[2])}
                        </label>

                        <label class="choice">
                            <input type="radio" name="answer" value="D">
                            D. ${escapeHTML(q.choices[3])}
                        </label>

                        <button class="submit-answer-btn" onclick="checkAnswer()">
                            ✅ 提交答案
                        </button>

                        <div id="answer-result"></div>
                    `;

                    badge.innerText =
                        '生成完成';

                } else {
                    throw new Error(
                        'AI 未成功產生題目'
                    );
                }

            } catch (error) {
                console.error(
                    'AI 題庫錯誤：',
                    error
                );

                qBox.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p>生成失敗：${escapeHTML(error.message)}</p>
                        <p style="font-size:0.85rem; margin-top:8px;">
                            請稍後再試。
                        </p>
                    </div>
                `;

                badge.innerText =
                    '生成失敗';

            } finally {
                generateBtn.disabled =
                    false;

                generateBtn.innerText =
                    '🔮 立即生成單選題';
            }
        }

        function checkAnswer() {
            if (!currentQuestion) {
                alert('目前沒有題目，請先生成題目。');
                return;
            }

            const selected =
                document.querySelector('input[name="answer"]:checked');

            if (!selected) {
                alert('請先選擇一個答案。');
                return;
            }

            const userAnswer = selected.value;
            const correctAnswer =
                String(currentQuestion.answer || '')
                    .trim()
                    .toUpperCase()
                    .charAt(0);

            const isCorrect = userAnswer === correctAnswer;
            const resultBox = document.getElementById('answer-result');

            resultBox.innerHTML = `
                <div class="result-feedback">
                    ${isCorrect ? '✅ 回答正確！' : '❌ 回答錯誤'}
                </div>

                <div class="answer">
                    🎯 標準答案：${escapeHTML(correctAnswer)}
                </div>

                <div class="explanation">
                    🔬 解析：<br>
                    ${escapeHTML(currentQuestion.explanation)}
                </div>
            `;
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>
</body>
</html>
