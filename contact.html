nav,

        /* 🎨 CSS 主題色彩變數：100% 同步所有頁面 */
        :root {
            --bg-main: #050505;
            --bg-gradient: linear-gradient(135deg, #020202 0%, #0d0d0d 100%);
            --nav-bg: rgba(15, 15, 15, 0.85);
            --card-bg: rgba(20, 20, 20, 0.85);
            --card-border: rgba(0, 255, 102, 0.15); 
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1a1a1a;
            --primary-light: #00ff66; /* 晶片螢光綠 */
            --accent: #00f0ff; 
            --shadow: 0 10px 35px rgba(0, 255, 102, 0.05);
            --logo-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --chat-bg: #ffffff;
            --input-bg: #f1f5f9;
            --primary-light: #2563eb; /* 科技藍 */
            --accent: #d97706;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --logo-color: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { cursor: auto; } button, a { cursor: pointer; } input, textarea { cursor: text; }

        body {
            background: var(--bg-main); background-image: var(--bg-gradient); color: var(--text-main);
            min-height: 100vh; padding-top: 90px;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.6s ease;
            overflow-x: hidden; position: relative;
        }

        /* ⚡ 發光漸層雷電游標 */

        /* 💥 點擊實體擴散圈 */
        .click-ripple {
            position: fixed; width: 10px; height: 10px; background: transparent; border: 3px solid var(--primary-light);
            border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            animation: ripple-out 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; box-shadow: 0 0 8px var(--primary-light);
        }
        @keyframes ripple-out { 0% { width: 10px; height: 10px; opacity: 1; border-width: 3px; } 100% { width: 55px; height: 55px; opacity: 0; border-width: 1px; } }

        #fx-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }

        /* 🟢 固定導覽列：1:1 還原複製 index.html 頂級流暢排版與寬度留白 */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--nav-bg); border-bottom: 1px solid var(--card-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 1000; transition: background 0.8s;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        nav .logo { font-size: 1.3rem; font-weight: bold; color: var(--logo-color) !important; transition: color 0.6s; }
        
        /* 右側群組排版 */
        .nav-right { display: flex; align-items: center; gap: 30px; }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-size: 1rem; font-weight: 500; }
        nav ul li a:hover { color: var(--primary-light); }
        
        .controls-group { display: flex; align-items: center; gap: 15px; }

        /* 黑膠唱片面板組件 */
        .music-player-container { display: flex; align-items: center; gap: 12px; background: var(--card-bg); padding: 6px 16px; border-radius: 30px; border: 1px solid var(--card-border); }
        .disc-btn { width: 36px; height: 36px; background: #111; border: 2px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .disc-btn::after { content: ''; position: absolute; width: 8px; height: 8px; background: var(--primary-light); border-radius: 50%; }
        .disc-btn.playing { animation: spin-disc 4s linear infinite; box-shadow: 0 0 10px var(--primary-light); border-color: var(--primary-light); }
        @keyframes spin-disc { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-box { display: flex; flex-direction: column; width: 110px; font-size: 0.75rem; color: var(--text-main); }
        .time-info { display: flex; justify-content: space-between; margin-bottom: 2px; font-family: monospace; }
        .slider-bar { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
        [data-theme="light"] .slider-bar { background: rgba(0,0,0,0.1); }
        .slider-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 8px; height: 8px; background: var(--primary-light); border-radius: 50%; cursor: pointer; box-shadow: 0 0 5px var(--primary-light); }

        .icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        /* 聯絡盒子排版 */
        .contact-box { max-width: 540px; margin: 50px auto; background: var(--card-bg); border: 1px solid var(--card-border); padding: 35px; border-radius: 20px; box-shadow: var(--shadow); transition: background 0.8s, border-color 0.8s; text-align: center; }
        .contact-box h2 { font-size: 1.8rem; margin-bottom: 5px; color: var(--primary-light); }
        .contact-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.95rem; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; outline: none; transition: border-color 0.3s, background 0.8s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-light); }
        
        .submit-btn { background: var(--primary-light); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; transition: opacity 0.2s; }
        [data-theme="dark"] .submit-btn { color: #000; }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { cursor: not-allowed; opacity: 0.65 !important; }
        /* ===== 手機版 RWD ===== */
@media (max-width: 768px) {

    body {
        padding-top: 170px;

    nav ul li a {

        writing-mode: horizontal-tb !important;
    }

    .controls-group {
        width: 100%;
        justify-content: center;
    }

    .music-player-container {

        justify-content: center;
    }

    .main-content,
    .course-container,
    .contact-container,

    .course-grid {

}

    <div class="contact-box">
        <h2>有事想說？</h2>
        <p>課程有疑問、網站遇到問題，或只是想提個建議，都可以寫給我們。</p>
        <form id="c-form">
            <div class="form-group">
                <label>您的姓名</label>
                <input type="text" id="c-name" required placeholder="請輸入姓名">
            </div>
            <div class="form-group">
                <label>電子郵件</label>
                <input type="email" id="c-email" required placeholder="請輸入聯絡電子信箱">
            </div>
            <div class="form-group">
                <label>諮詢內容</label>
                <textarea id="c-message" rows="5" required placeholder="把想說的寫在這裡，我們會看。"></textarea>
            </div>
            <button type="submit" class="submit-btn">送出訊息 ↗</button>
        </form>
    </div>

    <script>
        /* 已移除會遮住正常滑鼠的閃電追蹤特效。 */

        /* ✉️ 聯絡表單：本機 / GitHub Pages 自動切換後端 */
        const API_BASE_URL =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://junyi-myshop.onrender.com';

        const contactForm = document.getElementById('c-form');
        const submitBtn = contactForm.querySelector('.submit-btn');

        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('c-name').value.trim();
            const email = document.getElementById('c-email').value.trim();
            const message = document.getElementById('c-message').value.trim();

            if (!name || !email || !message) {
                alert('請完整填寫姓名、電子郵件與諮詢內容。');
                return;
            }

            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.65';
            submitBtn.innerText = '⏳ 傳送中...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/contact`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, message })
                });

                let data = {};
                try {
                    data = await res.json();
                } catch (_) {
                    // 後端若回傳非 JSON，保留空物件，後續用 HTTP 狀態判斷
                }

                if (!res.ok) {
                    throw new Error(data.message || `HTTP ${res.status}`);
                }

                if (data.success) {
                    alert('✅ 訊息已成功送出！我們收到後會盡快回覆你。');
                    contactForm.reset();
                } else {
                    throw new Error(data.message || '後端未回傳成功狀態');
                }
            } catch (error) {
                console.error('聯絡表單傳送失敗：', error);
                alert(`❌ 訊息傳送失敗：${error.message}\n請稍後再試。`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.innerText = originalText;
            }
        });
    </script>
