<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新興革命黨｜私人訊息</title>
<style>
:root{--bg:#090707;--panel:#141010;--line:rgba(218,181,72,.18);--text:#f5f1e8;--muted:#aaa29a;--gold:#d9b85f;--red:#8e1111;--red2:#5b0707;--mine:#6d1010;--other:#211919}
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",Arial,sans-serif}a,button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{height:100vh;display:grid;grid-template-rows:60px 1fr}header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(10,8,8,.94);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}.emblem{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}.brand small{display:block;color:var(--gold);font-size:9px;margin-top:2px}
.actions{display:flex;gap:6px}.hbtn{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:#ddd4cc;font-size:13px}
.layout{min-height:0;display:grid;grid-template-columns:320px 1fr}.sidebar{min-height:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#0f0c0c}.side-top{padding:14px;border-bottom:1px solid var(--line)}.side-top h2{font-size:20px;margin-bottom:10px}.search{width:100%;padding:10px 11px;border:1px solid rgba(255,255,255,.08);border-radius:10px;outline:0;background:rgba(255,255,255,.04);color:#fff}
.contacts{flex:1;overflow:auto;padding:7px}.contact{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;text-align:left}.contact:hover,.contact.active{background:rgba(217,184,95,.07)}
.avatar{width:41px;height:41px;flex:0 0 41px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#742020,#2b1111);border:1px solid var(--line);color:var(--gold);font-weight:900}.contact-name{font-weight:800;font-size:14px}.contact-sub{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.chat{min-width:0;min-height:0;display:flex;flex-direction:column}.chat-empty{margin:auto;color:var(--muted);text-align:center}.chat-head{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}.back{display:none;border:0;background:transparent;color:var(--gold);font-size:22px}.messages{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.row{display:flex}.row.mine{justify-content:flex-end}.bubble{max-width:min(72%,620px);padding:10px 12px;border-radius:14px;background:var(--other)}.row.mine .bubble{background:var(--mine)}.msg{white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px}.time{font-size:10px;color:#948b84;text-align:right;margin-top:4px}
.composer{padding:9px 11px;border-top:1px solid var(--line)}.sendbar{display:flex;align-items:end;gap:7px}.input{flex:1;min-height:38px;max-height:110px;resize:none;outline:0;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.04);color:#fff;padding:10px 11px}.send{height:38px;padding:0 14px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:800}.hidden{display:none!important}
@media(max-width:700px){.app{grid-template-rows:54px 1fr}header{padding:0 7px}.brand b{font-size:12px}.brand small{display:none}.emblem{width:29px;height:29px}.hbtn{width:34px;height:34px;padding:0;font-size:0;display:grid;place-items:center}.hbtn[href="revolution.html"]::before{content:"🏴";font-size:16px}.hbtn[href="feed.html"]::before{content:"📰";font-size:16px}#logoutBtn::before{content:"↪";font-size:16px}.layout{display:block;position:relative}.sidebar,.chat{position:absolute;inset:0}.chat{display:none}body.chat-open .sidebar{display:none}body.chat-open .chat{display:flex}.back{display:block}.sidebar{border-right:0}.bubble{max-width:86%}}
</style>
</head>
<body>
<div class="app">
<header><a class="brand" href="revolution.html"><div class="emblem">★</div><div><b>新興革命黨</b><small>TEXT MESSAGES</small></div></a><div class="actions"><a class="hbtn" href="revolution.html">第二網站</a><a class="hbtn" href="feed.html">動態牆</a><button class="hbtn" id="logoutBtn">登出</button></div></header>
<div class="layout">
  <aside class="sidebar"><div class="side-top"><h2>私人訊息</h2><input id="search" class="search" type="search" placeholder="搜尋會員…"></div><div id="contacts" class="contacts"><div class="empty">正在載入會員…</div></div></aside>
  <section class="chat">
    <div class="chat-empty" id="chatEmpty">💬<br><br>選擇一位會員開始私人對話</div>
    <div class="hidden" id="chatView" style="height:100%;display:flex;flex-direction:column">
      <div class="chat-head"><button class="back" id="backBtn">‹</button><div class="avatar" id="chatAvatar">U</div><div><b id="chatName">會員</b><div style="font-size:11px;color:var(--muted)">私人文字對話</div></div></div>
      <div class="messages" id="messages"></div>
      <div class="composer"><div class="sendbar"><textarea id="messageInput" class="input" rows="1" maxlength="2000" placeholder="輸入訊息…"></textarea><button id="sendBtn" class="send">送出</button></div></div>
    </div>
  </section>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,addDoc,query,orderBy,onSnapshot,serverTimestamp,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBNGJOpoMdyPLbM3R7-YrFcHlre9YMAaAw",authDomain:"junyi-chat.firebaseapp.com",projectId:"junyi-chat",storageBucket:"junyi-chat.firebasestorage.app",messagingSenderId:"395931311039",appId:"1:395931311039:web:f8532fea57a2f66c729f0a",measurementId:"G-DDB6M5V36C"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const contacts=$("contacts"),search=$("search"),chatEmpty=$("chatEmpty"),chatView=$("chatView"),messages=$("messages"),input=$("messageInput"),send=$("sendBtn");
let me=null,users=[],selected=null,unsub=null;
const esc=t=>(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const initials=n=>(n?.trim()?.[0]||"U").toUpperCase(),members=(a,b)=>[a,b].sort(),cid=(a,b)=>members(a,b).join("_");
const when=ts=>{if(!ts)return"剛剛";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})};

onAuthStateChanged(auth,u=>{if(!u){location.href="login.html";return}me=u;listenUsers()});
function listenUsers(){
  onSnapshot(collection(db,"users"),snap=>{users=[];snap.forEach(x=>{const u=x.data();if(u.uid&&u.uid!==me.uid)users.push(u)});users.sort((a,b)=>(a.displayName||a.email||"").localeCompare(b.displayName||b.email||"","zh-Hant"));render()},e=>{console.error(e);contacts.innerHTML='<div class="empty">會員清單載入失敗，請檢查 Firestore Rules。</div>'})
}
function render(){
  const term=search.value.trim().toLowerCase(),list=users.filter(u=>(u.displayName||u.email||"").toLowerCase().includes(term));contacts.innerHTML="";
  if(!list.length){contacts.innerHTML='<div class="empty">目前找不到其他會員。</div>';return}
  list.forEach(u=>{const name=u.displayName||u.email||"會員",b=document.createElement("button");b.className="contact"+(selected?.uid===u.uid?" active":"");b.innerHTML=`<div class="avatar">${esc(initials(name))}</div><div><div class="contact-name">${esc(name)}</div><div class="contact-sub">點擊開始私人對話</div></div>`;b.onclick=()=>choose(u);contacts.appendChild(b)})
}
search.oninput=render;

async function choose(u){
  selected=u;render();document.body.classList.add("chat-open");chatEmpty.classList.add("hidden");chatView.classList.remove("hidden");$("chatName").textContent=u.displayName||u.email||"會員";$("chatAvatar").textContent=initials(u.displayName||u.email||"會員");

  const id=cid(me.uid,u.uid);
  const chatRef=doc(db,"privateChats",id);

  try{
    const snap=await getDoc(chatRef);

    // 新聊天室才寫入 participants。
    // 舊聊天室不重寫 participants，避免 [A,B] / [B,A] 順序不同被 Rules 擋下。
    if(!snap.exists()){
      const participants=members(me.uid,u.uid);
      await setDoc(chatRef,{
        participants,
        participantNames:{
          [me.uid]:me.displayName||me.email||"會員",
          [u.uid]:u.displayName||u.email||"會員"
        },
        updatedAt:serverTimestamp()
      });
    }else{
      await setDoc(chatRef,{
        participantNames:{
          [me.uid]:me.displayName||me.email||"會員",
          [u.uid]:u.displayName||u.email||"會員"
        },
        updatedAt:serverTimestamp()
      },{merge:true});
    }
  }catch(e){
    console.error("建立/開啟聊天室失敗：",e);
    messages.innerHTML='<div class="chat-empty">聊天室權限設定尚未完成。請檢查 Firestore Rules。</div>';
    return;
  }

  if(unsub)unsub();
  unsub=onSnapshot(
    query(collection(db,"privateChats",id,"messages"),orderBy("createdAt","asc")),
    snap=>{
      messages.innerHTML="";
      snap.forEach(x=>{
        const m=x.data(),row=document.createElement("div");
        row.className="row"+(m.senderId===me.uid?" mine":"");
        row.innerHTML=`<div class="bubble"><div class="msg">${esc(m.text||"")}</div><div class="time">${when(m.createdAt)}</div></div>`;
        messages.appendChild(row)
      });
      messages.scrollTop=messages.scrollHeight
    },
    e=>{
      console.error(e);
      messages.innerHTML='<div class="chat-empty">訊息載入失敗，請檢查 Firestore Rules。</div>'
    }
  )
}
async function sendMsg(){
  if(!me||!selected)return;
  const text=input.value.trim();
  if(!text)return;

  send.disabled=true;

  try{
    const id=cid(me.uid,selected.uid);
    const chatRef=doc(db,"privateChats",id);
    const snap=await getDoc(chatRef);

    // 保證父聊天室存在，且不覆寫舊聊天室的 participants 順序
    if(!snap.exists()){
      await setDoc(chatRef,{
        participants:members(me.uid,selected.uid),
        participantNames:{
          [me.uid]:me.displayName||me.email||"會員",
          [selected.uid]:selected.displayName||selected.email||"會員"
        },
        updatedAt:serverTimestamp()
      });
    }

    await addDoc(
      collection(db,"privateChats",id,"messages"),
      {
        senderId:me.uid,
        receiverId:selected.uid,
        text,
        createdAt:serverTimestamp()
      }
    );

    // 只更新摘要，不再覆寫 participants
    await setDoc(chatRef,{
      lastMessage:text,
      updatedAt:serverTimestamp()
    },{merge:true});

    input.value="";
  }catch(e){
    console.error(e);
    alert("傳送失敗："+e.message);
  }finally{
    send.disabled=false;
  }
}
send.onclick=sendMsg;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}};
$("backBtn").onclick=()=>document.body.classList.remove("chat-open");
$("logoutBtn").onclick=async()=>{await signOut(auth);location.href="login.html"};
</script>
</body>
</html>
