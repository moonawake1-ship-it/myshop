<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新興革命黨｜私人訊息</title>
<style>
:root{
  --bg:#090707;--panel:#141010;--panel2:#1b1414;--line:rgba(218,181,72,.18);
  --text:#f5f1e8;--muted:#aaa29a;--gold:#d9b85f;--red:#8e1111;--red2:#5b0707;
  --mine:#6d1010;--other:#211919;--bad:#ff9090;--ok:#79df99
}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",Arial,sans-serif}
a,button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{height:100vh;display:grid;grid-template-rows:62px 1fr}
header{
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:rgba(10,8,8,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:5
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800}
.emblem{width:35px;height:35px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:1.2px;margin-top:2px}
.header-actions{display:flex;gap:7px;align-items:center}
.hbtn{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:#ddd4cc;font-size:13px}
.hbtn:hover{color:var(--gold)}
.layout{min-height:0;display:grid;grid-template-columns:330px 1fr}
.sidebar{min-height:0;border-right:1px solid var(--line);background:#0f0c0c;display:flex;flex-direction:column}
.sidebar-top{padding:16px;border-bottom:1px solid var(--line)}
.sidebar-top h2{font-size:21px;margin-bottom:11px}
.search{
  width:100%;border:1px solid rgba(255,255,255,.08);outline:none;border-radius:10px;
  padding:11px 12px;background:rgba(255,255,255,.04);color:#fff
}
.contacts{flex:1;overflow-y:auto;padding:8px}
.contact{
  width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:11px;
  padding:11px;border-radius:12px;text-align:left
}
.contact:hover,.contact.active{background:rgba(217,184,95,.07)}
.avatar{
  width:43px;height:43px;flex:0 0 43px;border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(135deg,#742020,#2b1111);
  border:1px solid var(--line);color:var(--gold);font-weight:900
}
.contact-info{min-width:0;flex:1}
.contact-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-contacts{padding:24px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}

.chat{min-width:0;min-height:0;display:flex;flex-direction:column;background:
  radial-gradient(circle at 50% 0%,rgba(142,17,17,.08),transparent 28%),#0b0909}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.chat-empty .big{font-size:42px;margin-bottom:12px}
.chat-head{
  height:62px;flex:0 0 62px;padding:0 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px;background:rgba(16,12,12,.86)
}
.back-mobile{display:none;border:0;background:transparent;color:var(--gold);font-size:23px;padding:4px}
.chat-head .avatar{width:38px;height:38px;flex-basis:38px}
.chat-title b{display:block;font-size:14px}.chat-title span{font-size:11px;color:var(--muted)}
.messages{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.row{display:flex}.row.mine{justify-content:flex-end}
.bubble{max-width:min(72%,620px);padding:10px 12px;border-radius:15px;background:var(--other);border:1px solid rgba(255,255,255,.04)}
.row.mine .bubble{background:var(--mine);border-color:rgba(217,184,95,.12)}
.msg-text{white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px}
.msg-img{display:block;max-width:100%;max-height:430px;border-radius:10px;margin-top:6px;object-fit:contain;background:#050505}
.msg-time{font-size:10px;color:#948b84;text-align:right;margin-top:5px}
.composer{
  flex:0 0 auto;padding:10px 12px;border-top:1px solid var(--line);
  background:rgba(15,12,12,.95)
}
.preview{display:none;position:relative;width:max-content;max-width:100%;margin-bottom:8px}
.preview img{width:110px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.remove{position:absolute;top:-7px;right:-7px;width:25px;height:25px;border:0;border-radius:50%;background:#000;color:#fff}
.sendbar{display:flex;align-items:end;gap:7px}
.image-label{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--gold);background:rgba(217,184,95,.04)
}
.image-label input{display:none}
.message-input{
  flex:1;min-height:38px;max-height:110px;resize:none;outline:none;border:1px solid rgba(255,255,255,.08);
  border-radius:12px;background:rgba(255,255,255,.04);color:#fff;padding:10px 12px;line-height:1.4
}
.send{
  height:38px;padding:0 15px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;font-weight:800
}
.send:disabled{opacity:.5}
.status{font-size:11px;min-height:15px;margin-top:5px;color:var(--muted)}
.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}
.hidden{display:none!important}

@media(max-width:720px){
  .app{grid-template-rows:56px 1fr}
  header{padding:0 8px}.brand{gap:6px}.brand b{font-size:12px}.brand small{display:none}.emblem{width:30px;height:30px}
  .hbtn{width:34px;height:34px;padding:0;font-size:0;display:grid;place-items:center}
  .hbtn[href="revolution.html"]::before{content:"🏴";font-size:16px}
  .hbtn[href="feed.html"]::before{content:"📰";font-size:16px}
  #logoutBtn::before{content:"↪";font-size:16px}
  .layout{display:block;position:relative}
  .sidebar,.chat{position:absolute;inset:0}
  .chat{display:none}
  body.chat-open .sidebar{display:none}
  body.chat-open .chat{display:flex}
  .back-mobile{display:block}
  .sidebar{border-right:0}.sidebar-top{padding:12px}.contacts{padding:6px}
  .messages{padding:12px}.bubble{max-width:86%}
}
</style>
</head>
<body>
<div class="app">
<header>
  <a class="brand" href="revolution.html">
    <div class="emblem">★</div>
    <div><b>新興革命黨</b><small>PRIVATE MESSAGES</small></div>
  </a>
  <div class="header-actions">
    <a class="hbtn" href="revolution.html">第二網站</a>
    <a class="hbtn" href="feed.html">動態牆</a>
    <button class="hbtn" id="logoutBtn">登出</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <h2>私人訊息</h2>
      <input id="search" class="search" type="search" placeholder="搜尋會員…">
    </div>
    <div id="contacts" class="contacts">
      <div class="empty-contacts">正在載入會員…</div>
    </div>
  </aside>

  <section class="chat" id="chat">
    <div class="chat-empty" id="chatEmpty">
      <div class="big">💬</div>
      <div>選擇一位會員開始私人對話</div>
    </div>

    <div class="hidden" id="chatView" style="height:100%;display:flex;flex-direction:column">
      <div class="chat-head">
        <button class="back-mobile" id="backBtn">‹</button>
        <div class="avatar" id="chatAvatar">U</div>
        <div class="chat-title"><b id="chatName">會員</b><span>私人對話</span></div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="preview" id="preview">
          <img id="previewImg" alt="圖片預覽">
          <button class="remove" id="removePreview">×</button>
        </div>
        <div class="sendbar">
          <label class="image-label" title="傳送照片">📷
            <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          </label>
          <textarea id="messageInput" class="message-input" rows="1" maxlength="2000" placeholder="輸入訊息…"></textarea>
          <button id="sendBtn" class="send">送出</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>
  </section>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{
  getFirestore,collection,doc,setDoc,addDoc,query,orderBy,onSnapshot,serverTimestamp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyBNGJOpoMdyPLbM3R7-YrFcHlre9YMAaAw",
  authDomain:"junyi-chat.firebaseapp.com",
  projectId:"junyi-chat",
  storageBucket:"junyi-chat.firebasestorage.app",
  messagingSenderId:"395931311039",
  appId:"1:395931311039:web:f8532fea57a2f66c729f0a",
  measurementId:"G-DDB6M5V36C"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id);
const contactsEl=$("contacts"),searchEl=$("search"),chatEmpty=$("chatEmpty"),chatView=$("chatView"),
messagesEl=$("messages"),messageInput=$("messageInput"),sendBtn=$("sendBtn"),statusEl=$("status"),
imageInput=$("imageInput"),preview=$("preview"),previewImg=$("previewImg"),removePreview=$("removePreview");

let me=null,users=[],selectedUser=null,selectedFile=null,unsubMessages=null;

const initials=name=>(name?.trim()?.[0]||"U").toUpperCase();
const escapeHTML=text=>(text||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const chatId=(a,b)=>[a,b].sort().join("_");
const timeText=ts=>{
  if(!ts)return"剛剛";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
};
function setStatus(t,type=""){statusEl.textContent=t;statusEl.className="status"+(type?" "+type:"")}

onAuthStateChanged(auth,user=>{
  if(!user){location.href="login.html";return}
  me=user;
  listenUsers();
});

function listenUsers(){
  onSnapshot(collection(db,"users"),snap=>{
    users=[];
    snap.forEach(x=>{
      const u=x.data();
      if(u.uid&&u.uid!==me.uid)users.push(u);
    });
    users.sort((a,b)=>(a.displayName||a.email||"").localeCompare(b.displayName||b.email||"","zh-Hant"));
    renderContacts();
  },err=>{
    console.error(err);
    contactsEl.innerHTML='<div class="empty-contacts">會員清單載入失敗，請檢查 Firestore Rules。</div>';
  });
}

function renderContacts(){
  const term=searchEl.value.trim().toLowerCase();
  const list=users.filter(u=>(u.displayName||u.email||"").toLowerCase().includes(term));
  contactsEl.innerHTML="";
  if(!list.length){
    contactsEl.innerHTML='<div class="empty-contacts">目前找不到其他會員。<br>其他使用者註冊後就會出現在這裡。</div>';
    return;
  }
  list.forEach(u=>{
    const name=u.displayName||u.email||"會員";
    const btn=document.createElement("button");
    btn.className="contact"+(selectedUser?.uid===u.uid?" active":"");
    btn.innerHTML=`<div class="avatar">${escapeHTML(initials(name))}</div>
      <div class="contact-info"><div class="contact-name">${escapeHTML(name)}</div>
      <div class="contact-sub">點擊開始私人對話</div></div>`;
    btn.onclick=()=>selectUser(u);
    contactsEl.appendChild(btn);
  });
}
searchEl.oninput=renderContacts;

async function selectUser(u){
  selectedUser=u;renderContacts();
  document.body.classList.add("chat-open");
  chatEmpty.classList.add("hidden");
  chatView.classList.remove("hidden");
  $("chatName").textContent=u.displayName||u.email||"會員";
  $("chatAvatar").textContent=initials(u.displayName||u.email||"會員");
  selectedFile=null;imageInput.value="";preview.style.display="none";previewImg.src="";setStatus("");

  const cid=chatId(me.uid,u.uid);
  await setDoc(doc(db,"privateChats",cid),{
    participants:[me.uid,u.uid],
    participantNames:{
      [me.uid]:me.displayName||me.email||"會員",
      [u.uid]:u.displayName||u.email||"會員"
    },
    updatedAt:serverTimestamp()
  },{merge:true});

  if(unsubMessages)unsubMessages();
  const mq=query(collection(db,"privateChats",cid,"messages"),orderBy("createdAt","asc"));
  unsubMessages=onSnapshot(mq,snap=>{
    messagesEl.innerHTML="";
    snap.forEach(x=>{
      const m=x.data(),mine=m.senderId===me.uid,row=document.createElement("div");
      row.className="row"+(mine?" mine":"");
      row.innerHTML=`<div class="bubble">
        ${m.text?`<div class="msg-text">${escapeHTML(m.text)}</div>`:""}
        ${m.imageUrl?`<img class="msg-img" src="${escapeHTML(m.imageUrl)}" loading="lazy" alt="聊天圖片">`:""}
        <div class="msg-time">${timeText(m.createdAt)}</div>
      </div>`;
      messagesEl.appendChild(row);
    });
    messagesEl.scrollTop=messagesEl.scrollHeight;
  },err=>{
    console.error(err);
    messagesEl.innerHTML='<div class="chat-empty">訊息載入失敗，請檢查 Firestore Rules。</div>';
  });
}

imageInput.onchange=()=>{
  const file=imageInput.files?.[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){setStatus("只能選擇圖片。","bad");imageInput.value="";return}
  if(file.size>8*1024*1024){setStatus("圖片請控制在 8MB 以內。","bad");imageInput.value="";return}
  selectedFile=file;previewImg.src=URL.createObjectURL(file);preview.style.display="block";setStatus("");
};
removePreview.onclick=()=>{
  selectedFile=null;imageInput.value="";preview.style.display="none";previewImg.src="";
};

async function sendMessage(){
  if(!me||!selectedUser)return;
  const text=messageInput.value.trim();
  if(!text&&!selectedFile)return;

  sendBtn.disabled=true;sendBtn.textContent="傳送中";setStatus("");
  const cid=chatId(me.uid,selectedUser.uid);
  let imageUrl="",imagePath="";

  try{
    if(selectedFile){
      const ext=(selectedFile.name.split(".").pop()||"jpg").toLowerCase();
      imagePath=`privateChats/${cid}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
      const imageRef=ref(storage,imagePath);
      await uploadBytes(imageRef,selectedFile,{contentType:selectedFile.type});
      imageUrl=await getDownloadURL(imageRef);
    }

    await addDoc(collection(db,"privateChats",cid,"messages"),{
      senderId:me.uid,
      receiverId:selectedUser.uid,
      text,imageUrl,imagePath,
      createdAt:serverTimestamp()
    });

    await setDoc(doc(db,"privateChats",cid),{
      participants:[me.uid,selectedUser.uid],
      lastMessage:text||"📷 圖片",
      updatedAt:serverTimestamp()
    },{merge:true});

    messageInput.value="";selectedFile=null;imageInput.value="";preview.style.display="none";previewImg.src="";
  }catch(err){
    console.error(err);
    setStatus(err.code==="storage/unauthorized"?"照片上傳權限被 Firebase Storage 阻擋。":"傳送失敗："+(err.message||"未知錯誤"),"bad");
  }finally{
    sendBtn.disabled=false;sendBtn.textContent="送出";
  }
}
sendBtn.onclick=sendMessage;
messageInput.onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
};
$("backBtn").onclick=()=>document.body.classList.remove("chat-open");
$("logoutBtn").onclick=async()=>{await signOut(auth);location.href="login.html"};
</script>
</body>
</html>
