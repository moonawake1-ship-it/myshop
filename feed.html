<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新興革命黨｜動態牆</title>
<style>
:root{
  --bg:#0a0808;--panel:#141010;--panel2:#1b1414;--line:rgba(218,181,72,.18);
  --text:#f5f1e8;--muted:#aaa29a;--gold:#d9b85f;
  --red:#8e1111;--red2:#5b0707;--ok:#79df99;--bad:#ff9090
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(142,17,17,.2),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:"Microsoft JhengHei",Arial,sans-serif
}
a,button{cursor:pointer}
a{text-decoration:none;color:inherit}
button,input,textarea{font:inherit}

header{
  position:sticky;top:0;z-index:20;height:62px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,8,8,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800}
.emblem{
  width:34px;height:34px;border:1.5px solid var(--gold);
  border-radius:50%;display:grid;place-items:center;color:var(--gold)
}
.brand small{
  display:block;color:var(--gold);font-size:9px;
  letter-spacing:1.2px;margin-top:2px
}
nav{display:flex;gap:7px;align-items:center}
.navbtn{
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.025);color:#ddd4cc;font-size:13px
}
.navbtn:hover{color:var(--gold)}

.wrap{max-width:820px;margin:auto;padding:26px 14px 60px}
.topline{margin-bottom:15px}
.topline h1{font-size:29px}
.topline p{color:var(--muted);font-size:13px;margin-top:5px}

.composer{
  border:1px solid var(--line);border-radius:17px;
  background:var(--panel);padding:16px;margin-bottom:18px
}
textarea{
  width:100%;min-height:110px;resize:vertical;border:0;outline:0;
  border-radius:11px;background:rgba(255,255,255,.04);
  color:#fff;padding:13px;font-size:15px;line-height:1.65
}
.tools{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;flex-wrap:wrap
}
.counter{font-size:11px;color:var(--muted)}
.photo-label{
  display:inline-flex;align-items:center;justify-content:center;
  padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;color:var(--gold);
  background:rgba(217,184,95,.04);
  font-size:13px;font-weight:800
}
.photo-label input{display:none}
.post-btn{
  margin-left:auto;border:0;padding:9px 14px;border-radius:10px;
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;font-weight:800
}
.post-btn:disabled{opacity:.5}

.preview{
  display:none;position:relative;margin-top:12px;
  border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:#050505
}
.preview img{
  width:100%;max-height:420px;display:block;object-fit:contain
}
.remove-preview{
  position:absolute;top:8px;right:8px;width:32px;height:32px;
  border:0;border-radius:50%;background:rgba(0,0,0,.75);
  color:#fff;font-size:19px
}
.status{min-height:18px;margin-top:8px;font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}

.feed{display:flex;flex-direction:column;gap:13px}
.post{
  border:1px solid var(--line);background:var(--panel);
  border-radius:17px;overflow:hidden
}
.post-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 15px 10px
}
.author{display:flex;align-items:center;gap:9px}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#742020,#2b1111);
  border:1px solid var(--line);color:var(--gold);font-weight:900
}
.author b{display:block;font-size:14px}
.meta{font-size:10px;color:var(--muted);margin-top:3px}
.delete{
  border:0;background:transparent;color:#8e8580;font-size:18px
}
.delete:hover{color:#ff9a9a}
.post-text{
  padding:0 15px 15px;white-space:pre-wrap;
  line-height:1.7;font-size:15px;word-break:break-word
}
.post-image{
  width:100%;max-height:650px;display:block;
  object-fit:contain;background:#050505;
  border-top:1px solid rgba(255,255,255,.045)
}

.post-actions{
  display:flex;gap:8px;padding:9px 12px;
  border-top:1px solid rgba(255,255,255,.045)
}
.action{
  border:0;background:transparent;color:var(--muted);
  padding:7px 9px;border-radius:8px;font-size:13px;
  transition:.15s ease
}
.action:hover{background:rgba(255,255,255,.045);color:var(--gold)}
.action.liked{color:#ff6f78;background:rgba(255,111,120,.08)}

.comments{
  display:none;
  border-top:1px solid rgba(255,255,255,.045);
  padding:12px 14px 14px;
  background:rgba(0,0,0,.10)
}
.comments.open{display:block}
.comment-list{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:10px
}
.comment{
  display:flex;gap:8px;align-items:flex-start
}
.comment-avatar{
  width:29px;height:29px;flex:0 0 29px;border-radius:50%;
  display:grid;place-items:center;
  background:#2a1818;color:var(--gold);
  border:1px solid var(--line);
  font-size:11px;font-weight:900
}
.comment-body{
  flex:1;min-width:0;
  background:rgba(255,255,255,.035);
  border-radius:10px;
  padding:8px 10px
}
.comment-top{
  display:flex;justify-content:space-between;gap:8px;
  margin-bottom:3px
}
.comment-name{font-size:12px;font-weight:800}
.comment-time{font-size:9px;color:var(--muted);white-space:nowrap}
.comment-text{
  font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word
}
.comment-delete{
  border:0;background:transparent;color:#7f7671;
  font-size:12px;margin-left:6px
}
.comment-delete:hover{color:#ff9a9a}

.comment-form{
  display:flex;gap:7px;align-items:center
}
.comment-input{
  flex:1;min-width:0;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#fff;outline:0;border-radius:10px;
  padding:9px 10px;font-size:13px
}
.comment-send{
  border:0;border-radius:9px;padding:9px 12px;
  background:var(--red);color:#fff;font-size:12px;font-weight:800
}
.comment-send:disabled{opacity:.5}

.empty,.login-needed{
  padding:32px 16px;text-align:center;
  border:1px dashed var(--line);
  border-radius:17px;color:var(--muted)
}
.login-needed{border-style:solid;background:var(--panel)}
.login-needed h2{color:var(--text);margin-bottom:8px}
.login-needed a{
  display:inline-block;margin-top:14px;padding:9px 12px;
  border-radius:9px;background:var(--red);color:#fff;font-weight:800
}
.hidden{display:none!important}

@media(max-width:650px){
  header{height:56px;padding:0 8px}
  .brand b{font-size:12px}.brand small{display:none}
  .emblem{width:29px;height:29px}
  .navbtn{
    width:34px;height:34px;padding:0;font-size:0;
    display:grid;place-items:center
  }
  .navbtn[href="revolution.html"]::before{content:"🏴";font-size:16px}
  .navbtn[href="messages.html"]::before{content:"💬";font-size:16px}
  #logoutBtn::before{content:"↪";font-size:16px}
  .wrap{padding:18px 10px 45px}
  .photo-label{font-size:12px;padding:8px 10px}
  .comment-form{align-items:stretch}
  .comment-send{padding:8px 10px}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="revolution.html">
    <div class="emblem">★</div>
    <div><b>新興革命黨</b><small>PHOTO SOCIAL</small></div>
  </a>
  <nav>
    <a class="navbtn" href="revolution.html">第二網站</a>
    <a class="navbtn" href="messages.html">私人訊息</a>
    <button class="navbtn" id="logoutBtn">登出</button>
  </nav>
</header>

<main class="wrap">
  <div class="topline">
    <h1>動態牆</h1>
    <p>文字、照片、按讚與留言皆可即時同步。</p>
  </div>

  <section class="login-needed hidden" id="loginNeeded">
    <h2>需要先登入</h2>
    <p>登入後才能發布、按讚與留言。</p>
    <a href="login.html">前往登入</a>
  </section>

  <section class="composer hidden" id="composer">
    <textarea id="postText" maxlength="1000" placeholder="分享一些內容……"></textarea>

    <div class="preview" id="preview">
      <img id="previewImg" alt="照片預覽">
      <button class="remove-preview" id="removePreview" title="移除照片">×</button>
    </div>

    <div class="tools">
      <label class="photo-label">
        📷 加入照片
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      </label>

      <span class="counter"><span id="count">0</span>/1000</span>

      <button class="post-btn" id="postBtn">發布</button>
    </div>

    <div class="status" id="status"></div>
  </section>

  <section class="feed" id="feed">
    <div class="empty">正在載入動態……</div>
  </section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{
  getAuth,onAuthStateChanged,signOut
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{
  getFirestore,collection,addDoc,deleteDoc,doc,query,orderBy,
  onSnapshot,serverTimestamp,setDoc,getDoc
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBNGJOpoMdyPLbM3R7-YrFcHlre9YMAaAw",
  authDomain:"junyi-chat.firebaseapp.com",
  projectId:"junyi-chat",
  storageBucket:"junyi-chat.firebasestorage.app",
  messagingSenderId:"395931311039",
  appId:"1:395931311039:web:f8532fea57a2f66c729f0a",
  measurementId:"G-DDB6M5V36C"
};

const CLOUDINARY_CLOUD_NAME="ptaxexhi";
const CLOUDINARY_UPLOAD_PRESET="rittqq";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const composer=$("composer");
const loginNeeded=$("loginNeeded");
const postText=$("postText");
const postBtn=$("postBtn");
const status=$("status");
const feed=$("feed");
const count=$("count");
const imageInput=$("imageInput");
const preview=$("preview");
const previewImg=$("previewImg");
const removePreview=$("removePreview");

let me=null;
let selectedFile=null;
let previewObjectUrl="";
let childUnsubs=[];

const esc=t=>(t||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));

const initials=n=>(n?.trim()?.[0]||"U").toUpperCase();

const when=ts=>{
  if(!ts)return"剛剛";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleString("zh-TW",{
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit"
  });
};

function setStatus(text,type=""){
  status.textContent=text;
  status.className="status"+(type?" "+type:"");
}

function clearSelectedImage(){
  if(previewObjectUrl){
    URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl="";
  }
  selectedFile=null;
  imageInput.value="";
  previewImg.src="";
  preview.style.display="none";
}

onAuthStateChanged(auth,user=>{
  me=user||null;
  composer.classList.toggle("hidden",!user);
  loginNeeded.classList.toggle("hidden",!!user);
});

$("logoutBtn").onclick=async()=>{
  if(!me){
    location.href="login.html";
    return;
  }
  await signOut(auth);
  location.href="login.html";
};

postText.oninput=()=>count.textContent=postText.value.length;

imageInput.onchange=()=>{
  const file=imageInput.files?.[0];
  if(!file)return;

  const allowed=[
    "image/jpeg","image/png","image/webp","image/gif"
  ];

  if(!allowed.includes(file.type)){
    setStatus("請選擇 JPG、PNG、WebP 或 GIF 圖片。","bad");
    imageInput.value="";
    return;
  }

  if(file.size>8*1024*1024){
    setStatus("圖片請控制在 8MB 以內。","bad");
    imageInput.value="";
    return;
  }

  clearSelectedImage();
  selectedFile=file;
  previewObjectUrl=URL.createObjectURL(file);
  previewImg.src=previewObjectUrl;
  preview.style.display="block";
  setStatus("");
};

removePreview.onclick=clearSelectedImage;

async function uploadToCloudinary(file){
  const endpoint=
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

  const formData=new FormData();
  formData.append("file",file);
  formData.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);

  const response=await fetch(endpoint,{
    method:"POST",
    body:formData
  });

  const data=await response.json();

  if(!response.ok){
    throw new Error(
      data?.error?.message ||
      "Cloudinary 圖片上傳失敗"
    );
  }

  return{
    imageUrl:data.secure_url,
    publicId:data.public_id
  };
}

postBtn.onclick=async()=>{
  if(!me){
    location.href="login.html";
    return;
  }

  const text=postText.value.trim();

  if(!text&&!selectedFile){
    setStatus("請輸入文字或加入照片。","bad");
    return;
  }

  postBtn.disabled=true;
  postBtn.textContent="發布中…";

  try{
    let imageUrl="";
    let cloudinaryPublicId="";

    if(selectedFile){
      setStatus("正在上傳照片…");
      const uploaded=await uploadToCloudinary(selectedFile);
      imageUrl=uploaded.imageUrl;
      cloudinaryPublicId=uploaded.publicId;
    }

    await addDoc(collection(db,"posts"),{
      uid:me.uid,
      author:me.displayName||me.email||"會員",
      text,
      imageUrl,
      cloudinaryPublicId,
      createdAt:serverTimestamp()
    });

    postText.value="";
    count.textContent="0";
    clearSelectedImage();
    setStatus("發布成功。","ok");

  }catch(error){
    console.error(error);
    setStatus("發布失敗："+(error.message||"未知錯誤"),"bad");
  }finally{
    postBtn.disabled=false;
    postBtn.textContent="發布";
  }
};

async function toggleLike(postId){
  if(!me){
    location.href="login.html";
    return;
  }

  const likeRef=doc(db,"posts",postId,"likes",me.uid);
  const current=await getDoc(likeRef);

  if(current.exists()){
    await deleteDoc(likeRef);
  }else{
    await setDoc(likeRef,{
      uid:me.uid,
      createdAt:serverTimestamp()
    });
  }
}

async function sendComment(postId,input,button){
  if(!me){
    location.href="login.html";
    return;
  }

  const text=input.value.trim();
  if(!text)return;

  button.disabled=true;

  try{
    await addDoc(
      collection(db,"posts",postId,"comments"),
      {
        uid:me.uid,
        author:me.displayName||me.email||"會員",
        text,
        createdAt:serverTimestamp()
      }
    );
    input.value="";
  }catch(error){
    console.error(error);
    alert("留言失敗："+error.message);
  }finally{
    button.disabled=false;
  }
}

function listenPostLikes(postId,button){
  const likesRef=collection(db,"posts",postId,"likes");

  const unsub=onSnapshot(likesRef,snapshot=>{
    const count=snapshot.size;
    let liked=false;

    snapshot.forEach(item=>{
      if(me&&item.id===me.uid)liked=true;
    });

    button.textContent=`${liked?"♥":"♡"} 喜歡 ${count}`;
    button.classList.toggle("liked",liked);
  });

  childUnsubs.push(unsub);
}

function listenPostComments(postId,listEl,countButton){
  const commentsQuery=query(
    collection(db,"posts",postId,"comments"),
    orderBy("createdAt","asc")
  );

  const unsub=onSnapshot(commentsQuery,snapshot=>{
    listEl.innerHTML="";
    countButton.textContent=`💬 留言 ${snapshot.size}`;

    if(snapshot.empty){
      listEl.innerHTML=
        '<div style="font-size:12px;color:var(--muted);padding:4px 0">還沒有留言。</div>';
      return;
    }

    snapshot.forEach(item=>{
      const comment=item.data();
      const mine=me&&comment.uid===me.uid;
      const row=document.createElement("div");
      row.className="comment";

      row.innerHTML=`
        <div class="comment-avatar">
          ${esc(initials(comment.author||"U"))}
        </div>

        <div class="comment-body">
          <div class="comment-top">
            <div class="comment-name">
              ${esc(comment.author||"會員")}
            </div>

            <div>
              <span class="comment-time">
                ${when(comment.createdAt)}
              </span>

              ${mine?`
                <button
                  class="comment-delete"
                  data-id="${item.id}"
                  title="刪除留言"
                >×</button>
              `:""}
            </div>
          </div>

          <div class="comment-text">
            ${esc(comment.text||"")}
          </div>
        </div>
      `;

      listEl.appendChild(row);
    });

    listEl.querySelectorAll(".comment-delete").forEach(btn=>{
      btn.onclick=async()=>{
        if(!confirm("確定刪除這則留言嗎？"))return;

        try{
          await deleteDoc(
            doc(
              db,
              "posts",
              postId,
              "comments",
              btn.dataset.id
            )
          );
        }catch(error){
          alert("刪除留言失敗："+error.message);
        }
      };
    });

  },error=>{
    console.error(error);
    listEl.innerHTML=
      '<div style="color:#ff9090;font-size:12px">留言載入失敗，請檢查 Firestore Rules。</div>';
  });

  childUnsubs.push(unsub);
}

const postsQuery=query(
  collection(db,"posts"),
  orderBy("createdAt","desc")
);

onSnapshot(postsQuery,snapshot=>{
  childUnsubs.forEach(fn=>fn());
  childUnsubs=[];

  feed.innerHTML="";

  if(snapshot.empty){
    feed.innerHTML='<div class="empty">目前還沒有貼文。</div>';
    return;
  }

  snapshot.forEach(item=>{
    const post=item.data();
    const postId=item.id;
    const mine=me&&post.uid===me.uid;

    const article=document.createElement("article");
    article.className="post";

    article.innerHTML=`
      <div class="post-head">
        <div class="author">
          <div class="avatar">
            ${esc(initials(post.author))}
          </div>

          <div>
            <b>${esc(post.author||"會員")}</b>
            <div class="meta">
              ${when(post.createdAt)}
            </div>
          </div>
        </div>

        ${mine?`
          <button
            class="delete"
            data-id="${postId}"
            title="刪除貼文"
          >⋯</button>
        `:""}
      </div>

      ${post.text?`
        <div class="post-text">
          ${esc(post.text)}
        </div>
      `:""}

      ${post.imageUrl?`
        <img
          class="post-image"
          src="${esc(post.imageUrl)}"
          alt="貼文照片"
          loading="lazy"
        >
      `:""}

      <div class="post-actions">
        <button class="action like-btn">
          ♡ 喜歡 0
        </button>

        <button class="action comment-toggle">
          💬 留言 0
        </button>
      </div>

      <div class="comments">
        <div class="comment-list"></div>

        <div class="comment-form">
          <input
            class="comment-input"
            type="text"
            maxlength="300"
            placeholder="寫下留言…"
          >

          <button class="comment-send">
            送出
          </button>
        </div>
      </div>
    `;

    feed.appendChild(article);

    const likeBtn=article.querySelector(".like-btn");
    const commentToggle=article.querySelector(".comment-toggle");
    const commentsBox=article.querySelector(".comments");
    const commentList=article.querySelector(".comment-list");
    const commentInput=article.querySelector(".comment-input");
    const commentSend=article.querySelector(".comment-send");

    likeBtn.onclick=async()=>{
      try{
        await toggleLike(postId);
      }catch(error){
        console.error(error);
        alert("按讚失敗："+error.message);
      }
    };

    commentToggle.onclick=()=>{
      commentsBox.classList.toggle("open");

      if(commentsBox.classList.contains("open")){
        setTimeout(()=>commentInput.focus(),50);
      }
    };

    commentSend.onclick=()=>sendComment(
      postId,
      commentInput,
      commentSend
    );

    commentInput.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        sendComment(
          postId,
          commentInput,
          commentSend
        );
      }
    };

    listenPostLikes(
      postId,
      likeBtn
    );

    listenPostComments(
      postId,
      commentList,
      commentToggle
    );
  });

  feed.querySelectorAll(".delete").forEach(button=>{
    button.onclick=async()=>{
      if(!confirm("確定刪除這篇貼文嗎？"))return;

      try{
        await deleteDoc(
          doc(db,"posts",button.dataset.id)
        );
      }catch(error){
        alert("刪除失敗："+error.message);
      }
    };
  });

},error=>{
  console.error(error);
  feed.innerHTML=
    '<div class="empty">載入失敗，請檢查 Firestore Rules。</div>';
});
</script>
</body>
</html>
